const CW = 320, PL = 24, PB = 16, PT_ = 8;
const yOf = (v, H, max) => PT_ + (H - PT_ - PB) * (1 - v / max);
const slotW = n => (CW - PL) / n;
const xLabel = (D, i) => D.length <= 7 ? wdShort(D[i]) : D[i].getDate();
const xLabels = (D, H) => D.map((d, i) => (D.length > 7 && i % 5 !== 0 && i !== D.length - 1) ? '' :
  `<text class="xl" x="${(PL + (i + .5) * slotW(D.length)).toFixed(1)}" y="${H - 3}">${xLabel(D, i)}</text>`).join('');
const yGrid = (H, max, ticks) => ticks.map(v => {
  const y = yOf(v, H, max).toFixed(1);
  return `<line class="gl ${v === 0 ? 'base' : ''}" x1="${PL}" x2="${CW}" y1="${y}" y2="${y}"/><text class="yl" x="${PL - 6}" y="${(+y + 3.2).toFixed(1)}">${v}</text>`;
}).join('');
const niceMax = v => { if (v <= 4) return 4; if (v <= 6) return 6; const p = Math.pow(10, Math.floor(Math.log10(v))); for (const m of [1, 2, 2.5, 5, 10]) if (m * p >= v) return m * p; return v; };

function chartPrayers(D) {
  const H = 150, max = 6, s = slotW(D.length), bw = Math.min(12, s * 0.34);
  let bars = '';
  D.forEach((d, i) => {
    const l = peek(d), cx = PL + (i + .5) * s;
    if (isExcused(d)) { bars += `<circle cx="${cx.toFixed(1)}" cy="${yOf(0.35, H, max).toFixed(1)}" r="2.6" style="fill:var(--pink)"/>`; return; }
    let acc = 0;
    ['jamaat', 'ontime', 'late'].forEach(k => {
      const c = FARD.filter(id => l[id] === k).length;
      if (!c) return;
      const y1 = yOf(acc + c, H, max), y0 = yOf(acc, H, max);
      bars += `<rect x="${(cx - bw - 1).toFixed(1)}" y="${y1.toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(1, y0 - y1 - 1).toFixed(1)}" rx="2" style="fill:${STATUS[k].color}"/>`;
      acc += c;
    });
    const rc = RATIB.filter(id => l[id] === true).length;
    if (rc) {
      const y1 = yOf(rc, H, max);
      bars += `<rect x="${(cx + 1).toFixed(1)}" y="${y1.toFixed(1)}" width="${bw.toFixed(1)}" height="${(yOf(0, H, max) - y1).toFixed(1)}" rx="2" style="fill:var(--brass);opacity:.8"/>`;
    }
  });
  return `<svg class="chart" viewBox="0 0 ${CW} ${H}" role="img" aria-label="${t('stats.prayers')}">${yGrid(H, max, [0, 2, 4, 6])}${bars}${xLabels(D, H)}</svg>`;
}
function chartBars(D, values, goal, color, label) {
  const H = 130, top = niceMax(Math.max(goal || 0, ...values, 1) * 1.1), s = slotW(D.length), bw = Math.min(16, s * 0.6);
  const bars = values.map((v, i) => {
    if (!v) return '';
    const cx = PL + (i + .5) * s, y = yOf(v, H, top), met = goal && v >= goal;
    return `<rect x="${(cx - bw / 2).toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${(yOf(0, H, top) - y).toFixed(1)}" rx="3" style="fill:${met ? 'var(--st-ontime)' : color}"/>`;
  }).join('');
  const g = goal ? `<line class="goal" x1="${PL}" x2="${CW}" y1="${yOf(goal, H, top).toFixed(1)}" y2="${yOf(goal, H, top).toFixed(1)}"/>` : '';
  return `<svg class="chart" viewBox="0 0 ${CW} ${H}" role="img" aria-label="${label}">${yGrid(H, top, [0, top / 2, top])}${g}${bars}${xLabels(D, H)}</svg>`;
}
function chartDots(D, rows) {
  const LAB = 70, rowH = 24, H = rows.length * rowH + 16, s = (CW - LAB) / D.length, r = Math.min(6.5, s * 0.36);
  const body = rows.map((row, ri) => {
    const y = ri * rowH + 12;
    return `<text class="rl" x="0" y="${y + 4}">${esc(row.label)}</text>` + D.map((d, i) => {
      const cx = (LAB + (i + .5) * s).toFixed(1), on = peek(d)[row.id] === true;
      if (row.prayer && isExcused(d)) return `<circle cx="${cx}" cy="${y}" r="${(r * .45).toFixed(1)}" style="fill:var(--pink)"/>`;
      return on ? `<circle cx="${cx}" cy="${y}" r="${r.toFixed(1)}" style="fill:${row.color}"/>`
        : `<circle cx="${cx}" cy="${y}" r="${(r - .75).toFixed(1)}" style="fill:none;stroke:var(--line);stroke-width:1.5"/>`;
    }).join('');
  }).join('');
  const xl = D.map((d, i) => (D.length > 7 && i % 5 !== 0 && i !== D.length - 1) ? '' :
    `<text class="xl" x="${(LAB + (i + .5) * s).toFixed(1)}" y="${H - 2}">${xLabel(D, i)}</text>`).join('');
  return `<svg class="chart" viewBox="0 0 ${CW} ${H}" role="img">${body}${xl}</svg>`;
}
/** Тепловая карта последнего года: 53 недели × 7 дней. */
function heatmap() {
  const today = todayDate(), start = addDays(today, -wdi(today) - 7 * 52);
  const cell = 5.2, step = 6, top = 11;
  let rects = '', labels = '', active = 0, perfect = 0, lastMonth = -1, labelEnd = -99;
  for (let c = 0; c < 53; c++) {
    for (let r = 0; r < 7; r++) {
      const d = addDays(start, c * 7 + r);
      if (d > today) continue;
      const has = !!S.logs[dkey(d)], p = has ? progress(d) : 0;
      if (has && p > 0) active++;
      if (p === 1) perfect++;
      const pct = p === 0 ? 0 : p < .34 ? 28 : p < .67 ? 55 : p < 1 ? 80 : 100;
      const fill = pct ? `color-mix(in srgb, var(--accent) ${pct}%, var(--surface-2))` : 'var(--surface-2)';
      rects += `<rect x="${c * step}" y="${top + r * step}" width="${cell}" height="${cell}" rx="1.3" style="fill:${fill}"><title>${human(d)}: ${Math.round(p * 100)}%</title></rect>`;
    }
    const first = addDays(start, c * 7);
    if (first.getMonth() !== lastMonth && first.getDate() <= 7 && c < 51) {
      lastMonth = first.getMonth();
      const txt = monthShort(first), w = txt.length * 4.3, x = c * step;
      if (x >= labelEnd + 4) { labels += `<text x="${x}" y="7">${esc(txt)}</text>`; labelEnd = x + w; }
    }
  }
  const legend = [0, 28, 55, 80, 100].map((p, i) => `<rect x="${236 + i * 8}" y="${top + 7 * step + 4}" width="6" height="6" rx="1.3" style="fill:${p ? `color-mix(in srgb, var(--accent) ${p}%, var(--surface-2))` : 'var(--surface-2)'}"/>`).join('');
  const H = top + 7 * step + 14;
  return {
    svg: `<svg class="chart heat" viewBox="0 0 318 ${H}" role="img" aria-label="${t('stats.year')}">${labels}${rects}
      <text x="230" y="${top + 7 * step + 9.5}" style="text-anchor:end">${t('stats.less')}</text>${legend}<text x="278" y="${top + 7 * step + 9.5}">${t('stats.more')}</text></svg>`,
    active, perfect,
  };
}
/** Связи между делами за последние 90 дней. */
function correlations() {
  const td = todayDate();
  const DEEDS = [
    { id: 'azkar_m', f: d => peek(d).azkar_m === true },
    { id: 'azkar_e', f: d => peek(d).azkar_e === true },
    { id: 'r_fajr', f: d => peek(d).r_fajr === true },
    { id: 'duha', f: d => peek(d).duha === true },
    { id: 'tahajjud', f: d => peek(d).tahajjud === true },
    { id: 'witr', f: d => peek(d).witr === true },
    { id: 'fardOnTime', f: d => FARD.every(x => ['ontime', 'jamaat'].includes(peek(d)[x])) },
    { id: 'fajrOnTime', f: d => ['ontime', 'jamaat'].includes(peek(d).fajr) },
    { id: 'quranGoal', f: d => iv(peek(d).quran) >= quranGoalFor(d) },
    { id: 'sleepPrev', f: d => SLEEP.some(x => peek(addDays(d, -1))[x] === true) },
  ];
  const days = [];
  for (let i = 1; i <= 90; i++) { const d = addDays(td, -i); if (S.logs[dkey(d)] && !isExcused(d)) days.push(d); }
  if (days.length < 14) return { need: 14 - days.length, list: [] };
  const out = [];
  for (const A of DEEDS) for (const B of DEEDS) {
    if (A === B || B.id === 'sleepPrev' || (A.id === 'fardOnTime' && B.id === 'fajrOnTime') || (A.id === 'fajrOnTime' && B.id === 'fardOnTime')) continue;
    let a = 0, ab = 0, na = 0, nab = 0;
    for (const d of days) { const x = A.f(d), y = B.f(d); if (x) { a++; if (y) ab++; } else { na++; if (y) nab++; } }
    if (a < 5 || na < 5) continue;
    const p1 = ab / a, p0 = nab / na;
    if (p1 < .3) continue;
    const lift = p1 / Math.max(p0, .05);
    if (lift >= 1.4) out.push({ a: A.id, b: B.id, lift });
  }
  out.sort((x, y) => y.lift - x.lift);
  const seen = new Set(), list = [];
  for (const c of out) { const k = [c.a, c.b].sort().join(); if (seen.has(k)) continue; seen.add(k); list.push(c); if (list.length === 4) break; }
  return { need: 0, list };
}

function viewStats() {
  const n = ui.statsDays, today = todayDate();
  const D = [...Array(n)].map((_, i) => addDays(today, i - n + 1));
  const okDays = D.filter(d => !isExcused(d));
  const pct = (a, b) => b ? Math.round(a / b * 100) : 0;
  const count = (ids, val) => okDays.reduce((s, d) => s + ids.filter(id => val(peek(d)[id])).length, 0);
  const fardOn = count(FARD, v => v === 'ontime' || v === 'jamaat');
  const jam = count(FARD, v => v === 'jamaat');
  const late = count(FARD, v => v === 'late');
  const ratib = count(RATIB, v => v === true);
  const quran = D.map(d => iv(peek(d).quran));
  const books = D.map(d => Object.entries(peek(d)).reduce((s, [k, v]) => s + (k.startsWith('book_') ? iv(v) : 0), 0));
  const sum = a => a.reduce((x, y) => x + y, 0);
  const qGoal = S.settings.khatmActive ? khatmTodayGoal() : S.settings.quranGoal;

  const azM = D.filter(d => peek(d).azkar_m === true).length, azE = D.filter(d => peek(d).azkar_e === true).length;
  const night = ['tahajjud', 'duha', 'witr'].map(id => okDays.filter(d => peek(d)[id] === true).length);
  const heat = heatmap(), corr = correlations();

  const card = (ic, title, metrics, body, legend = '') => `<section class="card">
    <div class="hd">${icon(ic)}<h2 class="grow">${title}</h2></div>
    ${metrics.length ? `<div class="chips-row">${metrics.map(([l, v]) => `<span>${l}: <b>${v}</b></span>`).join('')}</div>` : ''}

  const lg = items => `<div class="legend">${items.map(([c, l]) => `<span style="--c:${c}"><i></i>${l}</span>`).join('')}</div>`;
  const reading = S.books.filter(b => b.status === 'reading');

  return `<header class="top"><h1 class="grow">${t('stats.title')}</h1>
      <div class="seg" role="radiogroup">${[7, 30].map(v => `<button role="radio" aria-checked="${n === v}" class="${n === v ? 'on' : ''}" data-a="period" data-v="${v}">${t('stats.days', { n: v })}</button>`).join('')}</div></header>
    <div class="stat-top">
      <div class="metric"><b>${nDays(fardStreak())}</b><span>${t('stats.streak')}</span></div>
      <div class="metric"><b>${pct(fardOn, okDays.length * 5)}%</b><span>${t('stats.onTimePct')}</span></div>
    </div>
    ${card('cal', t('stats.year'), [[t('stats.activeDays'), heat.active], [t('stats.perfectDays'), heat.perfect]], heat.svg)}
    ${card('users', t('stats.prayers'), [[t('st.ontime'), t('n.of', { a: fardOn, b: okDays.length * 5 })], [t('st.jamaat'), jam], [t('st.late'), late], [t('stats.ratib'), `${pct(ratib, okDays.length * 6)}%`]],
      chartPrayers(D), lg([['var(--st-jamaat)', t('st.jamaat')], ['var(--st-ontime)', t('st.ontime')], ['var(--st-late)', t('st.late')], ['var(--brass)', t('stats.ratib')]]))}
    ${card('book', t('task.quran'), [[t('stats.total'), `${sum(quran)} ${t('u.p')}`], [t('stats.avg'), t('stats.perDay', { n: (sum(quran) / n).toFixed(1) })], [t('stats.goalMet'), nDays(qMet)]],
      chartBars(D, quran, qGoal, 'var(--accent)', t('task.quran')),
      lg([['var(--accent)', t('stats.pages')], ['var(--st-ontime)', t('stats.goalMet')], ['var(--brass)', t('stats.goalLine', { n: qGoal })]]))}
    ${card('lib', t('stats.books'), [[t('stats.total'), `${sum(books)} ${t('u.p')}`], [t('stats.avg'), t('stats.perDay', { n: (sum(books) / n).toFixed(1) })]],
      chartBars(D, books, 0, 'var(--n-tahajjud)', t('stats.books')) +
      (reading.length ? `<div style="margin-top:12px">${reading.map(b => `<div class="kv"><span>${esc(b.title)}</span><b>${b.currentPage} / ${b.totalPages}</b></div>
        <div class="bar" style="height:5px;margin-bottom:6px"><i style="width:${(b.currentPage / Math.max(1, b.totalPages) * 100).toFixed(0)}%;background:${SPINES[S.books.indexOf(b) % SPINES.length]}"></i></div>`).join('')}</div>`
        : `<p class="muted" style="margin:10px 0 0;font-size:13.5px">${t('stats.noBooks')}</p>`))}

    ${card('arrow', t('stats.corr'), [],
      corr.need ? `<p class="muted" style="margin:0">${t('stats.corrNeed', { n: nDays(corr.need) })}</p>`

    ${S.settings.female ? lg([['var(--pink)', t('chip.excused')]]) : ''}`;
}

function viewWizard() {
  const s = S.settings, step = ui.wiz, total = 5;
  const dots = `<div class="dots" aria-hidden="true">${[...Array(total)].map((_, i) => `<i class="${i === step ? 'on' : ''}"></i>`).join('')}</div>`;
  const opt = (a, v, label, on, sub = '', extra = '') => `<button class="opt ${on ? 'on' : ''}" data-a="${a}" data-v='${v}' ${extra}><span class="grow">${label}${sub ? `<small>${sub}</small>` : ''}</span>${on ? icon('check') : ''}</button>`;
  let body = '';
  if (step === 0) {
    body = `<div class="wiz-art">${SKYLINE}</div><div class="orn">۞</div><h1>${t('wiz.welcome')}</h1><p class="lead">${t('wiz.lead')}</p>
      <div class="opts">${[['ru', 'Русский'], ['en', 'English'], ['ar', 'العربية']].map(([v, l]) => opt('wizLang', v, l, s.lang === v, '', `lang="${v}"`)).join('')}</div>`;
  } else if (step === 1) {
    body = `<h1>${t('wiz.gender')}</h1><p class="lead">${t('wiz.genderLead')}</p>
      <div class="opts">${opt('wizGender', 'false', t('g.male'), !s.female)}${opt('wizGender', 'true', t('g.female'), s.female)}</div>`;
  } else if (step === 2) {
    body = `<h1>${t('wiz.city')}</h1><p class="lead">${t('wiz.cityLead')}</p>
      <div class="opts">${opt('wizCity', '"geo"', `${t('city.auto')}`, s.cityId === 'geo')}</div>
      <div class="opts grid2" style="margin-top:8px">${CITIES.map((c, i) => opt('wizCity', i, c[LANG], s.cityId === i)).join('')}</div>`;
  } else if (step === 3) {
    body = `<h1>${t('wiz.madhab')}</h1><p class="lead">${t('wiz.madhabLead')}</p>
      <div class="opts">${MADHABS.map(m => opt('wizMadhab', `"${m}"`, t('madhab.' + m), s.madhab === m, m === 'hanafi' ? t('wiz.asrHanafi') : t('wiz.asrStd'))).join('')}</div>`;
  } else {
    body = `<h1>${t('wiz.quran')}</h1><p class="lead">${t('wiz.quranLead')}</p>
      <div class="opts grid2">${[1, 2, 5, 10, 20].map(n => opt('wizQuran', n, `${n} ${pl(n, 'page')}`, s.quranGoal === n, n === 20 ? t('wiz.juz') : '')).join('')}</div>`;
  }
  return `<div class="wiz">${dots}${body}

      <span class="grow"></span>

        : `<button class="btn ghost" data-a="wizNext">${step === 2 ? t('wiz.skip') : t('b.next')}${icon('chev', 'dir')}</button>`}
    </div></div>`;
}

// =====================================================================
//  СОХРАНЕНИЕ + РЕАКЦИЯ НА ИЗМЕНЕНИЯ
// =====================================================================
function commit(reschedule = false) {
  ptCache = {};
  checkMilestones();
  // тихое завершение дня
  const td = todayDate(), p = progress(td);
  if (p === 1 && ui.lastP != null && ui.lastP < 1 && ui.tab === 'today' && ui.dayOffset === 0 && !ui.stack.length) {
    ui.glowUntil = Date.now() + 3200;
    setTimeout(() => { if (!root.classList.contains('open')) render(); }, 3300);
  }
  save();
  render();
  if (reschedule) scheduleWeb();
  if (freshMilestones.length) {
    const m = freshMilestones[freshMilestones.length - 1];
    freshMilestones = [];
    setTimeout(() => toast(t('ms.new', { x: msText(m).replace(/&[^;]+;/g, '"') })), 400);
  }
}

// =====================================================================
//  ОБРАБОТЧИКИ
// =====================================================================
const A = {
  tab: ds => { ui.tab = ds.v; ui.stack = []; if (ds.v === 'today') ui.dayOffset = 0; render(); window.scrollTo(0, 0); },
  open: ds => go(ds.v, ds.id),
  back: () => back(),
  day: ds => { const d = parseKey(ds.d); ui.stack = []; ui.tab = 'today'; ui.dayOffset = -daysBetween(d, todayDate()); render(); window.scrollTo(0, 0); },
  dayMove: ds => { ui.dayOffset = Math.min(0, ui.dayOffset + Number(ds.v)); render(); },
  dayToday: () => { ui.dayOffset = 0; render(); },
  calMove: ds => { ui.cal = new Date(ui.cal.getFullYear(), ui.cal.getMonth() + Number(ds.v), 1); render(); },
  hadith: () => { S.settings.hadithOpen = !S.settings.hadithOpen; save(); render(); },
  foldSec: ds => { const f = S.settings.folded; f[ds.v] = !f[ds.v]; save(); render(); },
  period: ds => { ui.statsDays = Number(ds.v); render(); },
  shelf: ds => { ui.shelf = ds.v; render(); },

  // ---------- намазы и дела ----------
  async fard(ds) {
    const d = parseKey(ds.d), id = ds.id, cur = peek(d)[id];
    const v = await new Promise(res => {
      openModal(`<h2>${t('task.' + id)}</h2><p class="prose" style="margin-top:-8px">${t('st.how')}</p>
        <div class="st-pick">${Object.entries(STATUS).map(([k, s]) => `<button class="stp ${cur === k ? 'on' : ''}" data-v="${k}" style="--c:${s.color}">${icon(s.icon)}<span>${t('st.' + k)}</span></button>`).join('')}</div>
        ${isPrayed(cur) ? `<button class="stp-clear" data-v="__clear">${icon('close')}${t('st.clear')}</button>` : ''}
        <details class="why"><summary>${icon('info')}${t('st.why')}</summary>${evidenceFor(id).map(evHtml).join('')}</details>`);
      modalResolve = res;
      root.querySelectorAll('[data-v]').forEach(b => b.onclick = () => closeModal(b.dataset.v));
    });
    if (v == null) return;
    setFard(d, id, v === '__clear' ? null : v);
    if (navigator.vibrate) navigator.vibrate(10);
  },
  fardTap: ds => A.fard(ds),
  toggle: ds => { toggleTask(parseKey(ds.d), ds.id); if (navigator.vibrate) navigator.vibrate(8); },
  count: ds => { const d = parseKey(ds.d), x = findTask(d, ds.id); if (x) addCount(d, x, Number(ds.v)); },
  async countInput(ds) {
    const d = parseKey(ds.d), x = findTask(d, ds.id);
    if (!x) return;
    if (x.id === 'quran') { const r = await quranDialog(); if (r) await readQuranTo(d, r); return; }
    const b = bookFor(x.id);
    if (b) {
      const p = await ask(t('book.whichPage'), b.currentPage, t('book.ofPages', { n: b.totalPages }));
      if (p == null) return;
      const np = clamp(p, 0, b.totalPages), diff = np - b.currentPage, l = logOf(d);
      l[x.id] = Math.max(0, iv(l[x.id]) + diff);
      b.currentPage = np;
      if (np >= b.totalPages && b.status !== 'done') setBookStatus(b, 'done');
      return commit();
    }
    const n = await ask(t('ctr.addHow', { x: x.title }), '', x.unit);
    if (n && n > 0) addCount(d, x, n);
  },
  safar: ds => { const d = parseKey(ds.d); setSafar(d, !isSafar(d)); },
  excused: ds => { const d = parseKey(ds.d); setExcused(d, !isExcused(d)); },
  async quranMark() { const r = await quranDialog(); if (r) await readQuranTo(todayDate(), r); },

  // ---------- настройки ----------
  set: ds => { S.settings[ds.k] = JSON.parse(ds.v); commit(true); },
  async flip(ds) {
    S.settings[ds.k] = !S.settings[ds.k];
    if (S.settings[ds.k] && ['remindFard', 'tahajjudAlarm', 'sleepReminder'].includes(ds.k)) await askNotify();
    commit(true);
  },
  step: ds => { S.settings[ds.k] = Math.max(1, S.settings[ds.k] + Number(ds.v)); commit(); },
  offset: ds => { const o = S.settings.offsets; o[ds.k] = clamp(o[ds.k] + Number(ds.v), -60, 60); commit(true); },
  track: ds => { const a = S.settings.disabled, i = a.indexOf(ds.id); i >= 0 ? a.splice(i, 1) : a.push(ds.id); commit(); },
  lang: ds => { S.settings.lang = ds.v; commit(true); },
  async perm() { await askNotify(); commit(true); },
  async city() {
    const v = await sheet(t('set.city'), [
      { v: 'geo', label: t('city.auto'), icon: 'pin', color: 'var(--accent)' },
      ...CITIES.map((c, i) => ({ v: i, label: c[LANG], sel: S.settings.cityId === i })),
      { v: 'custom', label: t('city.custom'), icon: 'edit' },
    ]);
    if (v == null) return;
    if (v === 'geo') return geolocate(() => commit(true));
    if (v === 'custom') {
      const r = await form({ title: t('city.customTitle'), text: t('city.customHint'), fields: [
        { name: 'name', label: t('city.name') }, { name: 'lat', type: 'number', label: t('city.lat') }, { name: 'lng', type: 'number', label: t('city.lng') }] });
      if (!r) return;
      if (r.lat == null || r.lng == null || !isFinite(r.lat) || !isFinite(r.lng) || Math.abs(r.lat) > 90 || Math.abs(r.lng) > 180) return toast(t('city.err'));
      Object.assign(S.settings, { cityId: 'custom', cityName: r.name || t('city.mine'), lat: r.lat, lng: r.lng });
      return commit(true);
    }
    setCity(v);
    commit(true);
  },
  async method() {
    const v = await sheet(t('set.method'), Object.keys(METHODS).map(k => ({ v: k, label: t('method.' + k), sel: S.settings.method === k })));
    if (v) { S.settings.method = v; commit(true); }
  },
  async madhab() {
    const v = await sheet(t('set.madhab'), MADHABS.map(m => ({ v: m, label: t('madhab.' + m), sel: S.settings.madhab === m })));
    if (v) { setMadhab(v); commit(true); }
  },

  // ---------- хатм ----------
  async khatmStart() {
    const days = await ask(t('khatm.askDays'), 30);
    if (!days || days < 1) return;
    const read = await ask(t('khatm.askRead'), 0, t('khatm.askReadHint'));
    if (read == null) return;
    Object.assign(S.settings, { khatmActive: true, khatmPage: clamp(read, 0, 604), khatmEnd: dkey(addDays(todayDate(), days - 1)) });
    commit();
  },
  async khatmDays() {
    const d = await ask(t('khatm.askLeft'), '');
    if (d && d >= 1) { S.settings.khatmEnd = dkey(addDays(todayDate(), d - 1)); commit(); }
  },
  async khatmPage() {
    const p = await ask(t('khatm.askRead'), S.settings.khatmPage);
    if (p != null) { S.settings.khatmPage = clamp(p, 0, 604); commit(); }
  },
  async khatmStop() {
    const fin = S.settings.khatmPage >= 604;
    if (!await confirmBox(fin ? t('khatm.newQ') : t('khatm.stopQ'), fin ? t('b.start') : t('b.finish'))) return;
    Object.assign(S.settings, { khatmActive: false, khatmPage: 0, khatmEnd: '' });
    commit();
  },

  // ---------- книги ----------
  async addBook(ds) {
    const r = await form({ title: t('book.new'), fields: [
      { name: 'title', label: t('book.fTitle') }, { name: 'author', label: t('book.fAuthor') },
      { name: 'total', type: 'number', label: t('book.fPages') }, { name: 'goal', type: 'number', label: t('book.fGoal'), value: 10 },
      { name: 'shelf', type: 'select', label: t('book.fShelf'), value: ds && ds.v === 'want' ? 'want' : 'reading', options: [['reading', t('shelf.reading')], ['want', t('shelf.want')]] },
      { name: 'cover', type: 'file', label: t('book.fCover') }],
      submit: t('b.add') });
    if (!r) return;
    if (!r.title || !(r.total > 0) || !(r.goal > 0)) return toast(t('book.err'));
    let cover = null;
    if (r.cover) { try { cover = await toCover(r.cover); } catch (e) { toast(t('book.coverErr')); } }
    const b = { id: uid(), title: r.title, author: r.author, totalPages: Math.round(r.total), currentPage: 0, dailyGoal: Math.round(r.goal), notes: [], status: 'want', startedAt: null, finishedAt: null, rating: 0, cover };
    if (r.shelf === 'reading') setBookStatus(b, 'reading');
    S.books.push(b);
    ui.shelf = b.status;
    commit();
  },
  async editBook(ds) {
    const b = S.books.find(x => x.id === ds.id);
    const r = await form({ title: t('book.edit'), fields: [
      { name: 'title', label: t('book.fTitle'), value: b.title }, { name: 'author', label: t('book.fAuthor'), value: b.author },
      { name: 'total', type: 'number', label: t('book.fPages'), value: b.totalPages }] });
    if (!r) return;
    if (!r.title || !(r.total > 0)) return toast(t('book.err'));
    Object.assign(b, { title: r.title, author: r.author, totalPages: Math.round(r.total) });
    b.currentPage = Math.min(b.currentPage, b.totalPages);
    commit();
  },
  coverPick: ds => {
    const b = S.books.find(x => x.id === ds.id);
    const inp = document.createElement('input');
    inp.type = 'file'; inp.accept = 'image/*';
    inp.onchange = async () => {
      const f = inp.files[0];
      if (!f) return;
      try { b.cover = await toCover(f); commit(); } catch (e) { toast(t('book.coverErr')); }
    };
    inp.click();
  },
  async coverRemove(ds) {
    if (!await confirmBox(t('book.coverRemoveQ'))) return;
    S.books.find(x => x.id === ds.id).cover = null; commit();
  },
  bookStatus: ds => {
    const b = S.books.find(x => x.id === ds.id);
    if (b.status === ds.v) return;
    if (ds.v === 'reading' && b.status === 'done') b.currentPage = 0;
    setBookStatus(b, ds.v);
    commit();
  },
  rate: ds => { const b = S.books.find(x => x.id === ds.id); b.rating = b.rating === Number(ds.v) ? 0 : Number(ds.v); commit(); },
  async bookPage(ds) {
    const b = S.books.find(x => x.id === ds.id);
    const n = await ask(t('book.whichPage'), b.currentPage, t('book.ofPages', { n: b.totalPages }));
    if (n == null) return;
    const np = clamp(n, 0, b.totalPages), diff = np - b.currentPage;
    if (b.status === 'reading' && diff) { const l = logOf(todayDate()), k = 'book_' + b.id; l[k] = Math.max(0, iv(l[k]) + diff); }
    b.currentPage = np;
    if (np >= b.totalPages && b.status !== 'done') setBookStatus(b, 'done');
    commit();
  },
  async bookGoal(ds) {
    const b = S.books.find(x => x.id === ds.id);
    const n = await ask(t('book.fGoal'), b.dailyGoal);
    if (n && n > 0) { b.dailyGoal = n; commit(); }
  },
  async addNote(ds) {
    const b = S.books.find(x => x.id === ds.id);
    const r = await form({ title: t('book.addNote'), fields: [
      { name: 'x', type: 'textarea', placeholder: t('book.notePh') }, { name: 'p', type: 'number', label: t('book.notePage'), value: b.currentPage || '' }] });
    if (!r || !r.x) return;
    b.notes.unshift({ text: r.x, page: r.p == null || !isFinite(r.p) ? null : Math.round(r.p), date: dkey(new Date()) });
    commit();
  },
  async delNote(ds) {
    if (!await confirmBox(t('book.delNoteQ'))) return;
    S.books.find(x => x.id === ds.id).notes.splice(Number(ds.v), 1); commit();
  },
  async delBook(ds) {
    if (!await confirmBox(t('book.delQ'))) return;
    S.books = S.books.filter(x => x.id !== ds.id); ui.stack.pop(); commit();
  },

  // ---------- цели ----------
  async addGoal() {
    const now = new Date(), eom = dkey(new Date(now.getFullYear(), now.getMonth() + 1, 0));
    const r = await form({ title: t('goals.new'), fields: [
      { name: 'title', label: t('goals.fTitle'), placeholder: t('goals.fTitlePh') },
      { name: 'target', type: 'number', label: t('goals.fTarget') },
      { name: 'unit', label: t('goals.fUnit'), value: t('goals.fUnitDef') },
      { name: 'deadline', type: 'date', label: t('goals.fDeadline'), value: eom }], submit: t('b.add') });
    if (!r) return;
    if (!r.title || !(r.target > 0) || !r.deadline) return toast(t('goals.err'));
    S.goals.push({ id: uid(), title: r.title, target: Math.round(r.target), current: 0, unit: r.unit, deadline: r.deadline });
    commit();
  },
  goalStep: ds => { const g = S.goals.find(x => x.id === ds.id); g.current = clamp(g.current + Number(ds.v), 0, g.target); goalCheck(g); commit(); },
  async goalSet(ds) {
    const g = S.goals.find(x => x.id === ds.id);
    const n = await ask(t('goals.askDone'), g.current, g.unit);
    if (n != null) { g.current = clamp(n, 0, g.target); goalCheck(g); commit(); }
  },
  async delGoal(ds) { if (await confirmBox(t('goals.delQ'))) { S.goals = S.goals.filter(x => x.id !== ds.id); commit(); } },

  // ---------- дуа, свои пункты, вехи ----------
  async addDua() {
    const x = await askText(t('dua.ask'), '', true);
    if (x) { S.duas.unshift({ id: uid(), text: x, created: dkey(new Date()), accepted: null }); commit(); }
  },
  duaToggle: ds => { const d = S.duas.find(x => x.id === ds.id); d.accepted = d.accepted ? null : dkey(new Date()); commit(); },
  async delDua(ds) { if (await confirmBox(t('dua.delQ'))) { S.duas = S.duas.filter(x => x.id !== ds.id); commit(); } },
  async addCustom() {
    const r = await form({ title: t('items.newCustom'), fields: [
      { name: 'title', label: t('items.fTitle'), placeholder: t('items.fTitlePh') },
      { name: 'type', type: 'select', label: t('items.fType'), value: 'check', options: [['check', t('items.check')], ['counter', t('items.counter')]] },
      { name: 'target', type: 'number', label: t('items.fTarget'), value: 100 },
      { name: 'unit', label: t('items.fUnit'), value: t('items.fUnitDef') }], submit: t('b.add') });
    if (!r || !r.title) return;
    const counter = r.type === 'counter';
    S.customs.push({ id: uid(), title: r.title, counter, target: counter ? Math.max(1, Math.round(r.target || 1)) : 1, unit: counter ? r.unit : '' });
    commit();
  },
  async delCustom(ds) { if (await confirmBox(t('items.delQ'))) { S.customs = S.customs.filter(x => x.id !== ds.id); commit(); } },
  async addAvoid() {
    const x = await askText(t('items.askAvoid'), t('items.askAvoidPh'));
    if (x) { S.avoids.push({ id: uid(), title: x }); commit(); }
  },
  async delAvoid(ds) { if (await confirmBox(t('items.delQ'))) { S.avoids = S.avoids.filter(x => x.id !== ds.id); commit(); } },
  async addMs() {
    const r = await form({ title: t('ms.add'), fields: [{ name: 'x', label: t('ms.fText'), placeholder: t('ms.fTextPh') }, { name: 'date', type: 'date', label: t('ms.fDate'), value: dkey(todayDate()) }], submit: t('b.add') });
    if (!r || !r.x || !r.date) return;
    S.milestones.push({ id: uid(), key: 'custom-' + uid(), type: 'custom', text: r.x, date: r.date });
    commit();
  },
  async delMs(ds) { if (await confirmBox(t('ms.delQ'))) { S.milestones = S.milestones.filter(x => x.id !== ds.id); commit(); } },

  // ---------- резервная копия ----------
  async exportData() {
    const text = JSON.stringify(S);
    let copied = false;
    try { await navigator.clipboard.writeText(text); copied = true; } catch (e) {}
    try {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([text], { type: 'application/json' }));
      a.download = `tracker-backup-${dkey(new Date())}.json`;
      document.body.appendChild(a); a.click(); a.remove();
    } catch (e) {}
    toast(copied ? t('set.exported') : t('set.exportedFile'));
  },
  async importData() {
    const r = await form({ title: t('set.import'), text: t('set.importHint'), fields: [{ name: 'x', type: 'textarea', placeholder: '{"settings":…}' }], submit: t('set.importBtn'), danger: true });
    if (!r || !r.x) return;
    try {
      const d = JSON.parse(r.x);
      if (!d || typeof d !== 'object' || !d.settings || !d.logs) throw new Error();
      S = normalize(d); S.settings.onboarded = true;
      ui.stack = []; ui.tab = 'today'; ui.dayOffset = 0; commit(true); toast(t('set.imported'));
    } catch (e) { toast(t('set.importErr')); }
  },
  redoWizard: () => { S.settings.onboarded = false; ui.wiz = 0; ui.stack = []; save(); render(); window.scrollTo(0, 0); },

  // ---------- мастер ----------
  wizLang: ds => { S.settings.lang = ds.v; ui.wiz = 1; save(); render(); },
  wizGender: ds => { S.settings.female = JSON.parse(ds.v); ui.wiz = 2; save(); render(); },
  wizCity: ds => {
    const v = JSON.parse(ds.v);
    if (v === 'geo') return geolocate(() => { ui.wiz = 3; save(); render(); });
    setCity(v); ui.wiz = 3; save(); render();
  },
  wizMadhab: ds => { setMadhab(JSON.parse(ds.v)); ui.wiz = 4; save(); render(); },
  wizQuran: ds => { S.settings.quranGoal = JSON.parse(ds.v); save(); render(); },
  wizBack: () => { ui.wiz = Math.max(0, ui.wiz - 1); render(); },
  wizNext: () => { ui.wiz = Math.min(4, ui.wiz + 1); render(); },
  wizFinish: () => { S.settings.onboarded = true; ui.tab = 'today'; ui.dayOffset = 0; commit(true); window.scrollTo(0, 0); toast(t('wiz.ready')); },
};

function setCity(i) { const c = CITIES[i]; Object.assign(S.settings, { cityId: i, cityName: c.ru, lat: c.lat, lng: c.lng }); ptCache = {}; }
function setMadhab(m) { S.settings.madhab = m; S.settings.hanafiAsr = m === 'hanafi'; ptCache = {}; }
function goalCheck(g) { if (g.current >= g.target) addMilestone('goal-' + g.id, { type: 'goal', title: g.title }); }
function geolocate(done) {
  if (!navigator.geolocation) return toast(t('city.geoNo'));
  toast(t('city.geoWait'));
  navigator.geolocation.getCurrentPosition(
    p => { Object.assign(S.settings, { cityId: 'geo', cityName: null, lat: +p.coords.latitude.toFixed(4), lng: +p.coords.longitude.toFixed(4) }); ptCache = {}; done(); },
    () => toast(t('city.geoErr')), { timeout: 10000 });
}

// =====================================================================
//  ЖЕСТЫ: долгое нажатие (довод) и свайп (дни)
// =====================================================================
const lp = { timer: null, fired: false, x: 0, y: 0 };
document.addEventListener('pointerdown', e => {
  const el = e.target.closest('[data-info]');
  lp.fired = false;
  if (!el) return;
  lp.x = e.clientX; lp.y = e.clientY;
  clearTimeout(lp.timer);
  lp.timer = setTimeout(() => { lp.fired = true; if (navigator.vibrate) navigator.vibrate(15); showInfo(el.dataset.info); }, 520);
});
document.addEventListener('pointermove', e => { if (lp.timer && (Math.abs(e.clientX - lp.x) > 10 || Math.abs(e.clientY - lp.y) > 10)) { clearTimeout(lp.timer); lp.timer = null; } });
['pointerup', 'pointercancel'].forEach(ev => document.addEventListener(ev, () => { clearTimeout(lp.timer); lp.timer = null; }));
document.addEventListener('contextmenu', e => {
  const el = e.target.closest('[data-info]');
  if (!el) return;
  e.preventDefault();
  clearTimeout(lp.timer); lp.timer = null;
  if (!lp.fired) { lp.fired = true; showInfo(el.dataset.info); }
});

let sw = null;
app.addEventListener('touchstart', e => { if (e.touches.length === 1) sw = { x: e.touches[0].clientX, y: e.touches[0].clientY, t: Date.now() }; }, { passive: true });
app.addEventListener('touchend', e => {
  if (!sw || ui.stack.length || ui.tab !== 'today' || !S.settings.onboarded) return;
  const dx = e.changedTouches[0].clientX - sw.x, dy = e.changedTouches[0].clientY - sw.y, dt = Date.now() - sw.t;
  sw = null;
  if (Math.abs(dx) < 70 || Math.abs(dy) > 45 || dt > 600) return;
  const toPast = LANG === 'ar' ? dx < 0 : dx > 0;
  const before = ui.dayOffset;
  ui.dayOffset = Math.min(0, ui.dayOffset + (toPast ? -1 : 1));
  if (ui.dayOffset !== before) render();
}, { passive: true });

document.addEventListener('click', e => {
  if (lp.fired) { lp.fired = false; e.preventDefault(); e.stopPropagation(); return; }
  const el = e.target.closest('[data-a]');
  if (!el || el.disabled || !A[el.dataset.a]) return;
  e.preventDefault();
  A[el.dataset.a](el.dataset, el);
}, true);

// =====================================================================
//  ЗАПУСК
// =====================================================================
let lastDay = dkey(todayDate());
setInterval(() => {
  const d = dkey(todayDate());
  if (d !== lastDay) { lastDay = d; scheduleWeb(); }
  if (!ui.stack.length && ui.tab === 'today' && !root.classList.contains('open') && S.settings.onboarded) render();
}, 60000);
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && !root.classList.contains('open')) { render(); scheduleWeb(); }
});
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}

// ярлыки на иконке приложения
const params = new URLSearchParams(location.search);
const goTo = params.get('go');
if (['today', 'lib', 'stats', 'more'].includes(params.get('tab'))) ui.tab = params.get('tab');
if (params.toString()) { try { history.replaceState(null, '', location.pathname); } catch (e) {} }

render();
scheduleWeb();

if (S.settings.onboarded && goTo) {
  const td = todayDate(), k = dkey(td);
  if (goTo === 'quran') A.countInput({ id: 'quran', d: k });
  if (goTo === 'pray' && !isExcused(td)) {
    const p = prayerTimes(new Date()), now = new Date();
    let id = FARD.find(x => !isPrayed(peek(td)[x])) || 'isha';
    if (p) { const order = [['fajr', p.fajr], ['zuhr', p.dhuhr], ['asr', p.asr], ['maghrib', p.maghrib], ['isha', p.isha]]; for (const [x, tm] of order) if (now >= tm) id = x; }
    A.fard({ id, d: k });
  }
}
if (S.settings.onboarded && !S.settings.tipInfo) {
  setTimeout(() => { if (!root.classList.contains('open')) { toast(t('tip.long')); S.settings.tipInfo = true; save(); } }, 1800);
} else if (S.settings.onboarded && !S.settings.tipRatib) {
  setTimeout(() => { if (!root.classList.contains('open')) { toast(t('tip.ratib')); S.settings.tipRatib = true; save(); } }, 1800);
}

</script>
