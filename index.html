      <div class="rd-row"><span class="rd-sess"></span><span class="rd-num num"></span></div>
      <input class="rd-range" type="range" min="1" max="1" value="1" aria-label="${t('rd.page')}">
    </footer>
    <div class="rd-load" hidden></div>`;
  document.body.appendChild(el);
  RD.el = el;
  el.addEventListener('click', e => {
    const b = e.target.closest('[data-r]');
    if (!b) return;
    e.preventDefault(); e.stopPropagation();
    RA[b.dataset.r] && RA[b.dataset.r](b);
  });
  const rng = el.querySelector('.rd-range');
  rng.addEventListener('input', () => { el.querySelector('.rd-num').textContent = `${rng.value} / ${RD.n}`; });
  rng.addEventListener('change', () => goPage(Number(rng.value), 'jump'));
  // жесты на странице: тапы, свайпы, двойной тап и своё увеличение пальцами
  const st = el.querySelector('#rdStage');
  const zl = document.createElement('div');
  zl.className = 'rd-zoom'; zl.hidden = true;
  el.appendChild(zl);
  let pd = null, tap = null, tapT = 0, pinch = null, wz = null;
  const begin = (x, y) => { pd = { x, y, t: Date.now(), sl: st.scrollLeft, max: st.scrollWidth - st.clientWidth }; };
  const finish = (x, y) => {
    if (!pd) return;
    const s = pd; pd = null;
    const dx = x - s.x, dy = y - s.y, dt = Date.now() - s.t;
    const sel = (window.getSelection && String(window.getSelection())) || '';
    if (sel.trim()) return;
    const paged = S.settings.reader.mode === 'page', rtl = LANG === 'ar', zoomed = RD.z > 1.01;
    if (paged && Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.4 && dt < 700) {
      // в увеличении листаем, только если страницу уже дотянули до края
      if (zoomed && (Math.abs(st.scrollLeft - s.sl) > 2 || (dx < 0 ? s.sl < s.max - 2 : s.sl > 2))) return;
      return goPage(RD.page + ((dx < 0) !== rtl ? 1 : -1), 'flip');
    }
    if (Math.abs(dx) > 10 || Math.abs(dy) > 10 || dt > 450) return;
    const z = x / window.innerWidth;
    if (paged && !zoomed && z < 0.28) return goPage(RD.page + (rtl ? 1 : -1), 'flip');
    if (paged && !zoomed && z > 0.72) return goPage(RD.page + (rtl ? -1 : 1), 'flip');
    if (tap && Date.now() - tap.t < 320 && Math.hypot(x - tap.x, y - tap.y) < 40) {
      clearTimeout(tapT); tap = null;
      return zoomTo(RD.z > 1.05 ? 1 : 2, x, y);
    }
    tap = { x, y, t: Date.now() };
    clearTimeout(tapT);
    tapT = setTimeout(() => { tap = null; setChrome(!RD.chrome); }, 280);
  };
  st.addEventListener('pointerdown', e => { if (e.pointerType !== 'touch' && e.isPrimary) begin(e.clientX, e.clientY); });
  st.addEventListener('pointerup', e => { if (e.pointerType !== 'touch' && e.isPrimary) finish(e.clientX, e.clientY); });
  const dist = ts => Math.hypot(ts[0].clientX - ts[1].clientX, ts[0].clientY - ts[1].clientY);
  const mid = ts => ({ x: (ts[0].clientX + ts[1].clientX) / 2, y: (ts[0].clientY + ts[1].clientY) / 2 });
  st.addEventListener('touchstart', e => {
    if (e.touches.length === 2) {
      e.preventDefault();
      pd = null; tap = null; clearTimeout(tapT);
      const c = mid(e.touches);
      pinch = { d0: Math.max(10, dist(e.touches)), c0: c, c, s: 1, z0: RD.z };
      pinchStart(pinch);
    } else if (e.touches.length === 1 && !pinch) begin(e.touches[0].clientX, e.touches[0].clientY);
    else pd = null;
  }, { passive: false });
  st.addEventListener('touchmove', e => {
    if (!pinch || e.touches.length < 2) return;
    e.preventDefault();
    pinch.c = mid(e.touches);
    pinch.s = clamp(pinch.z0 * dist(e.touches) / pinch.d0, 0.85, 3.2) / pinch.z0;
    pinchMove(pinch);
  }, { passive: false });
  const tend = e => {
    if (pinch) { if (e.touches.length < 2) { const p = pinch; pinch = null; pinchEnd(p); } pd = null; return; }
    if (e.touches.length === 0 && pd && e.type === 'touchend') { const t0 = e.changedTouches[0]; finish(t0.clientX, t0.clientY); }
    else if (e.type === 'touchcancel') pd = null;
  };
  st.addEventListener('touchend', tend);
  st.addEventListener('touchcancel', tend);
  // трекпад / Ctrl + колесо на компьютере
  st.addEventListener('wheel', e => {
    if (!e.ctrlKey) return;
    e.preventDefault();
    if (!wz) { const c = { x: e.clientX, y: e.clientY }; wz = { c0: c, c, s: 1, z0: RD.z, t: 0 }; pinchStart(wz); }
    wz.s = clamp(wz.z0 * wz.s * Math.exp(-e.deltaY * 0.01), 1, 3) / wz.z0;
    pinchMove(wz);
    clearTimeout(wz.t);
    wz.t = setTimeout(() => { const p = wz; wz = null; pinchEnd(p); }, 220);
  }, { passive: false });
  // штатное увеличение браузера в читалке выключено — у нас своё, с перерисовкой
  el.addEventListener('gesturestart', e => e.preventDefault());
  st.addEventListener('scroll', () => { if (S.settings.reader.mode === 'scroll') requestAnimationFrame(trackScroll); if (RD.z > 1.01) scheduleDetail(); }, { passive: true });
  document.addEventListener('keydown', e => {
    if (el.hidden || root.classList.contains('open')) return;
    if (e.key === 'Escape') RA.close();
    if (S.settings.reader.mode === 'page' && (e.key === 'ArrowRight' || e.key === 'ArrowLeft')) {
      goPage(RD.page + ((e.key === 'ArrowRight') !== (LANG === 'ar') ? 1 : -1), 'flip');
    }
  });
  let rz = 0;
  window.addEventListener('resize', () => { if (el.hidden) return; clearTimeout(rz); rz = setTimeout(() => layout(true), 200); });
  return el;
}

function setChrome(v) { RD.chrome = v; RD.el.classList.toggle('immersive', !v); }

async function openReader(bookId, fileId, page) {
  const b = S.books.find(x => x.id === bookId);
  if (!b || !b.files || !b.files.length) return;
  const f = b.files.find(x => x.id === fileId) || mainFile(b);
  const el = readerShell();
  RD.gen++;
  const gen = RD.gen;
  Object.assign(RD, { b, f, page: clamp(page || f.lastPage || 1, 1, f.pages), n: f.pages, crop: {}, uniCrop: null, jumpFrom: null });
  el.hidden = false;
  document.body.classList.add('rd-open');
  el.className = `rd t-${readerTheme()}`;
  setChrome(true);
  el.querySelector('.rd-title b').textContent = b.title;
  el.querySelector('.rd-title span').textContent = b.files.length > 1 ? f.name : '';
  el.querySelector('.rd-stage').innerHTML = '';
  const load = el.querySelector('.rd-load');
  load.hidden = false; load.textContent = t('rd.loading');
  try {
    const lib = await loadPdfJs();
    const buf = await FDB.get(f.id);
    if (!buf) throw new Error('missing');
    if (RD.doc) { try { RD.doc.destroy(); } catch (e) {} }
    RD.doc = await lib.getDocument({ data: new Uint8Array(buf) }).promise;
    if (gen !== RD.gen) return;
    RD.n = RD.doc.numPages;
    if (RD.n !== f.pages) { f.pages = RD.n; }
    b.lastFile = f.id;
  } catch (e) {
    load.hidden = true;
    closeReader(false);
    toast(e && e.message === 'missing' ? t('rd.missing') : t('rd.badPdf'));
    return;
  }
  load.hidden = true;
  const rng = el.querySelector('.rd-range');
  rng.max = String(RD.n);
  await layout(false);
}

function closeReader(doCommit = true) {
  if (!RD.el) return;
  RD.gen++;
  if (RD.obs) { RD.obs.disconnect(); RD.obs = null; }
  clearTimeout(RD.detT);
  RD.el.querySelectorAll('canvas').forEach(freeCanvas);
  RD.el.hidden = true;
  RD.el.querySelector('.rd-stage').innerHTML = '';
  document.body.classList.remove('rd-open');
  if (RD.doc) { try { RD.doc.destroy(); } catch (e) {} RD.doc = null; }
  if (doCommit) commit();
}

/** Поля страницы: ищем рамку содержимого на маленьком рендере. Аккуратно: не больше 18% с каждой стороны. */
async function detectCrop(n) {
  if (RD.crop[n]) return RD.crop[n];
  const none = { l: 0, t: 0, r: 0, b: 0 };
  try {
    const page = await RD.doc.getPage(n), vp = page.getViewport({ scale: 0.25 });
    const c = document.createElement('canvas');
    c.width = Math.ceil(vp.width); c.height = Math.ceil(vp.height);
    const ctx = c.getContext('2d', { willReadFrequently: true });
    ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
    await page.render({ canvasContext: ctx, viewport: vp }).promise;
    const { data, width: W, height: H } = ctx.getImageData(0, 0, c.width, c.height);
    freeCanvas(c);
    const dark = (x, y) => { const i = (y * W + x) * 4; return data[i] * 0.3 + data[i + 1] * 0.59 + data[i + 2] * 0.11 < 215; };
    const rowHas = y => { let k = 0; for (let x = 0; x < W; x++) if (dark(x, y) && ++k > 1) return true; return false; };
    const colHas = x => { let k = 0; for (let y = 0; y < H; y++) if (dark(x, y) && ++k > 1) return true; return false; };
    let t0 = 0, b0 = H - 1, l0 = 0, r0 = W - 1;
    while (t0 < H && !rowHas(t0)) t0++;
    while (b0 > t0 && !rowHas(b0)) b0--;
    while (l0 < W && !colHas(l0)) l0++;
    while (r0 > l0 && !colHas(r0)) r0--;
    if (t0 >= H || (r0 - l0) / W < 0.3 || (b0 - t0) / H < 0.2) return (RD.crop[n] = none);
    const pad = 0.02, cap = 0.18;
    const cr = {
      l: clamp(l0 / W - pad, 0, cap), r: clamp(1 - (r0 + 1) / W - pad, 0, cap),
      t: clamp(t0 / H - pad, 0, cap), b: clamp(1 - (b0 + 1) / H - pad, 0, cap),
    };
    return (RD.crop[n] = cr);
  } catch (e) { return (RD.crop[n] = none); }
}

async function layout(keep) {
  const st = rdStage(), mode = S.settings.reader.mode;
  if (RD.obs) { RD.obs.disconnect(); RD.obs = null; }
  st.querySelectorAll('canvas').forEach(freeCanvas);
  st.innerHTML = '';
  st.scrollTop = 0; st.scrollLeft = 0;
  if (mode === 'scroll') RD.z = clamp(Number(RD.b.rz) || 1, 1, 3);
  else if (!keep || RD.mode !== 'page') RD.z = 1;
  RD.mode = mode; RD.g = null;
  st.className = 'rd-stage ' + (mode === 'scroll' ? 'scroll' : 'paged');
  if (mode === 'scroll') await layoutScroll();
  else await showPage(RD.page);
  updateBars();
}

function pageMarkHtml(n) {
  const m = (RD.b.marks || []).find(x => x.f === RD.f.id && x.p === n);
  return m ? `<i class="rd-flag" style="--c:${MARKS[m.c]}"></i>` : '';
}

// ---- Чёткость: рисуем в настоящем разрешении экрана, ровно по пикселям ----
const MAXPX_PAGE = 16e6, MAXPX_SCROLL = 8e6;   // предел холста iOS ≈ 16,7 млн точек
const rdStage = () => RD.el.querySelector('.rd-stage');
const freeCanvas = c => { c.width = 0; c.height = 0; };   // iOS сразу отдаёт память

/** Размер коробки страницы (синхронно) и временное растяжение старого рисунка до готовности нового. */
function geom(box, g, scale, sw) {
  const st = rdStage(), cr = g.cr;
  const W = g.w * scale, H = g.h * scale;
  let bw = Math.round(W * (1 - cr.l - cr.r)), bh = Math.round(H * (1 - cr.t - cr.b));
  // чётность как у экрана — страница встаёт по центру без полупикселей
  if (((sw ?? st.clientWidth) - bw) & 1) bw--;
  if (box.dataset.single && (st.clientHeight - bh) & 1) bh--;
  box.style.width = `${bw}px`; box.style.height = `${bh}px`;
  const old = box.querySelector('.rd-inner');
  if (old && old._s && old._n === Number(box.dataset.n)) {
    old.style.transform = `translate(${-cr.l * W}px,${-cr.t * H}px) scale(${scale / old._s})`;
  }
  return { W, H };
}

/** Отрисовка страницы в коробку: старый рисунок остаётся, пока новый не готов. */
async function paint(box, n, g, scale) {
  const tok = (box._tok = {}), gen = RD.gen;
  if (box._task) { try { box._task.cancel(); } catch (e) {} box._task = null; }
  let { W, H } = geom(box, g, scale);
  const page = await RD.doc.getPage(n);
  if (gen !== RD.gen || box._tok !== tok) return;
  const v = page.getViewport({ scale: 1 });
  if (Math.abs(v.width - g.w) > 0.5 || Math.abs(v.height - g.h) > 0.5) {   // страница другого формата
    g = box._g = { ...g, w: v.width, h: v.height };
    ({ W, H } = geom(box, g, scale));
  }
  const cr = g.cr;
  let d = window.devicePixelRatio || 1;
  const lim = S.settings.reader.mode === 'scroll' ? MAXPX_SCROLL : MAXPX_PAGE;
  if (W * H * d * d > lim) d = Math.sqrt(lim / (W * H));
  const cw = Math.round(W * d), ch = Math.round(H * d);
  const inner = document.createElement('div');
  inner.className = 'rd-inner';
  const D = window.devicePixelRatio || 1, tx = Math.round(cr.l * W * D) / D, ty = Math.round(cr.t * H * D) / D;
  inner.style.cssText = `width:${cw / d}px;height:${ch / d}px;transform:translate(${-tx}px,${-ty}px)`;
  inner._s = scale; inner._n = n; inner._d = d;
  const canvas = document.createElement('canvas');
  canvas.width = cw; canvas.height = ch;
  canvas.style.width = `${cw / d}px`; canvas.style.height = `${ch / d}px`;
  const tl = document.createElement('div');
  tl.className = 'textLayer';
  tl.style.setProperty('--scale-factor', String(scale));
  inner.append(canvas, tl);
  const task = page.render({ canvasContext: canvas.getContext('2d'), viewport: page.getViewport({ scale: scale * d }) });
  box._task = task;
  try { await task.promise; } catch (e) { freeCanvas(canvas); return; }
  if (box._task === task) box._task = null;
  if (gen !== RD.gen || box._tok !== tok) { freeCanvas(canvas); return; }
  box.querySelectorAll('canvas').forEach(freeCanvas);
  box.replaceChildren(inner);
  box.insertAdjacentHTML('afterbegin', pageMarkHtml(n));
  box.dataset.done = '1';
  if (d < D - 0.05) scheduleDetail();
  try { await new PDFJS.TextLayer({ textContentSource: page.streamTextContent(), container: tl, viewport: page.getViewport({ scale }) }).render(); } catch (e) {}
}

async function showPage(n) {
  const st = rdStage(), my = (RD.showTok = {});
  const page = await RD.doc.getPage(n), vp1 = page.getViewport({ scale: 1 });
  const cr = S.settings.reader.crop ? await detectCrop(n) : { l: 0, t: 0, r: 0, b: 0 };
  if (RD.showTok !== my || !RD.doc) return;
  const AW = st.clientWidth - 12, AH = st.clientHeight - 12;
  const fit = Math.min(AW / (vp1.width * (1 - cr.l - cr.r)), AH / (vp1.height * (1 - cr.t - cr.b)));
  let box = st.querySelector('.rd-page');
  if (!box) {
    box = document.createElement('div');
    box.className = 'rd-page'; box.dataset.single = '1';
    st.appendChild(box);
  }
  const prev = Number(box.dataset.n) || 0;
  box.dataset.n = String(n);
  box._g = { w: vp1.width, h: vp1.height, cr, fit };
  st.classList.toggle('zoom', RD.z > 1.01);
  const p = paint(box, n, box._g, fit * RD.z);
  if (RD.z > 1.01 && prev && prev !== n) {   // листание в увеличении: к началу новой страницы
    const fwd = n > prev;
    st.scrollTop = fwd ? 0 : st.scrollHeight;
    st.scrollLeft = fwd !== (LANG === 'ar') ? 0 : st.scrollWidth;
  }
  await p;
}

async function layoutScroll() {
  const st = rdStage();
  let cr = { l: 0, t: 0, r: 0, b: 0 };
  if (S.settings.reader.crop) {
    // одна общая обрезка для ленты, чтобы страницы не «прыгали»
    const sample = [Math.min(RD.n, 2), Math.min(RD.n, 3), Math.min(RD.n, Math.max(1, RD.page))];
    const cs = await Promise.all([...new Set(sample)].map(detectCrop));
    cr = ['l', 't', 'r', 'b'].reduce((o, k) => (o[k] = Math.min(...cs.map(c => c[k])), o), {});
  }
  RD.uniCrop = cr;
  const p1 = (await RD.doc.getPage(1)).getViewport({ scale: 1 });
  const AW = st.clientWidth - 12;
  RD.g = { w: p1.width, h: p1.height, cr, fit: AW / (p1.width * (1 - cr.l - cr.r)) };
  const scale = RD.g.fit * RD.z;
  const list = document.createElement('div');
  list.className = 'rd-list';
  let pw = Math.round(p1.width * scale * (1 - cr.l - cr.r));
  if ((st.clientWidth - pw) & 1) pw--;
  const ph = Math.round(p1.height * scale * (1 - cr.t - cr.b));
  const html = [];
  for (let i = 1; i <= RD.n; i++) html.push(`<div class="rd-page" data-n="${i}" style="width:${pw}px;height:${ph}px"><span class="rd-pn">${i}</span></div>`);
  list.innerHTML = html.join('');
  st.appendChild(list);
  const target = list.querySelector(`.rd-page[data-n="${RD.page}"]`);
  if (target) st.scrollTop = target.offsetTop - 6;
  sweep();
}

/** Экономия памяти в ленте: рисуем только соседние страницы, дальние освобождаем. */
function sweep() {
  if (!RD.el || S.settings.reader.mode !== 'scroll' || !RD.g) return;
  const big = RD.z > 1.5;
  const a = RD.page - (big ? 1 : 2), b = RD.page + (big ? 1 : 3);
  const st = rdStage();
  for (const box of st.querySelectorAll('.rd-page[data-busy]')) {
    const n = Number(box.dataset.n);
    if (n < a - 1 || n > b + 1) freeBox(box);
  }
  for (let n = Math.max(1, a); n <= Math.min(RD.n, b); n++) {
    const box = st.querySelector(`.rd-page[data-n="${n}"]`);
    if (box && !box.dataset.busy) { box.dataset.busy = '1'; const g = box._g || RD.g; paint(box, n, g, g.fit * RD.z); }
  }
}
function freeBox(box) {
  box._tok = null;
  if (box._task) { try { box._task.cancel(); } catch (e) {} box._task = null; }
  box.querySelectorAll('canvas').forEach(freeCanvas);
  box.innerHTML = `<span class="rd-pn">${box.dataset.n}</span>`;
  delete box.dataset.done; delete box.dataset.busy;
}

/** В сильном увеличении холст упирается в предел iOS — видимую часть дорисовываем в полном разрешении. */
function scheduleDetail() { clearTimeout(RD.detT); RD.detT = setTimeout(detail, 160); }
async function detail() {
  if (!RD.el || RD.el.hidden || !RD.doc) return;
  const D = window.devicePixelRatio || 1, st = rdStage(), sr = st.getBoundingClientRect(), gen = RD.gen;
  for (const box of st.querySelectorAll('.rd-page[data-done]')) {
    const inner = box.querySelector('.rd-inner');
    if (box._task || !inner || !inner._d || inner._d >= D - 0.05) continue;
    const br = box.getBoundingClientRect();
    if (br.bottom < sr.top || br.top > sr.bottom) continue;
    const ir = inner.getBoundingClientRect(), mx = sr.width * 0.25, my = sr.height * 0.25;
    let x0 = Math.max(br.left, sr.left - mx) - ir.left, y0 = Math.max(br.top, sr.top - my) - ir.top;
    const x1 = Math.min(br.right, sr.right + mx) - ir.left, y1 = Math.min(br.bottom, sr.bottom + my) - ir.top;
    if (x1 - x0 < 8 || y1 - y0 < 8) continue;
    x0 = Math.floor(x0 * D) / D; y0 = Math.floor(y0 * D) / D;
    const old = inner.querySelector('.rd-tile');
    if (old && old._r[0] <= x0 + 0.5 && old._r[1] <= y0 + 0.5 && old._r[2] >= x1 - 0.5 && old._r[3] >= y1 - 0.5) continue;
    const cw = Math.ceil((x1 - x0) * D), ch = Math.ceil((y1 - y0) * D);
    if (cw * ch > MAXPX_PAGE) continue;
    const c = document.createElement('canvas');
    c.className = 'rd-tile'; c.width = cw; c.height = ch;
    c.style.cssText = `left:${x0}px;top:${y0}px;width:${cw / D}px;height:${ch / D}px`;
    c._r = [x0, y0, x0 + cw / D, y0 + ch / D];
    const page = await RD.doc.getPage(Number(box.dataset.n));
    try {
      await page.render({ canvasContext: c.getContext('2d'), viewport: page.getViewport({ scale: inner._s * D, offsetX: -x0 * D, offsetY: -y0 * D }) }).promise;
    } catch (e) { freeCanvas(c); continue; }
    if (gen !== RD.gen || box.querySelector('.rd-inner') !== inner || box._task) { freeCanvas(c); continue; }
    const o2 = inner.querySelector('.rd-tile');
    if (o2) { freeCanvas(o2); o2.remove(); }
    inner.insertBefore(c, inner.querySelector('.textLayer'));
  }
}

// ---- Своё увеличение: 1×–3×, перерисовка после жеста ----
function anchorAt(x, y) {
  const st = rdStage(), e = document.elementFromPoint(x, y), b = e && e.closest && e.closest('.rd-page');
  return b && st.contains(b) ? b : st.querySelector(`.rd-page[data-n="${RD.page}"]`) || st.querySelector('.rd-page');
}
function zoomLabel(z) {
  const zl = RD.el.querySelector('.rd-zoom');
  zl.textContent = `${Math.round(z * 100)}%`;
  zl.hidden = false;
  clearTimeout(RD.zlT);
  RD.zlT = setTimeout(() => { zl.hidden = true; }, 900);
}
function pinchStart(p) {
  p.box = anchorAt(p.c0.x, p.c0.y);
  p.el = S.settings.reader.mode === 'scroll' ? rdStage().querySelector('.rd-list') : p.box;
  if (!p.el) return;
  const r = p.el.getBoundingClientRect();
  p.el.style.transformOrigin = `${p.c0.x - r.left}px ${p.c0.y - r.top}px`;
  p.el.style.willChange = 'transform';
}
function pinchMove(p) {
  if (!p.el) return;
  p.el.style.transform = `translate(${p.c.x - p.c0.x}px,${p.c.y - p.c0.y}px) scale(${p.s})`;
  zoomLabel(clamp(p.z0 * p.s, 1, 3));
}
function pinchEnd(p) {
  if (!p.el) return;
  p.el.style.transform = ''; p.el.style.transformOrigin = ''; p.el.style.willChange = '';
  const z = clamp(p.z0 * p.s, 1, 3);
  if (Math.abs(z - RD.z) < 0.02 && Math.hypot(p.c.x - p.c0.x, p.c.y - p.c0.y) < 4) return;
  zoomTo(z, p.c0.x, p.c0.y, p.c.x, p.c.y, p.box);
}
/** Новый масштаб: точка (fx,fy) страницы встаёт в (tx,ty) экрана. */
function zoomTo(z, fx, fy, tx = fx, ty = fy, anchor = null) {
  z = z < 1.06 ? 1 : clamp(z, 1, 3);
  const st = rdStage();
  anchor = anchor && anchor.isConnected ? anchor : anchorAt(fx, fy);
  if (!anchor) return;
  const r0 = anchor.getBoundingClientRect();
  const px = (fx - r0.left) / (r0.width || 1), py = (fy - r0.top) / (r0.height || 1);
  RD.z = z;
  if (S.settings.reader.mode === 'scroll') {
    RD.b.rz = z; scheduleSave();
    const sw = st.clientWidth;
    for (const box of st.querySelectorAll('.rd-page')) {
      const g = box._g || RD.g;
      if (box.dataset.busy) paint(box, Number(box.dataset.n), g, g.fit * z);
      else geom(box, g, g.fit * z, sw);
    }
  } else {
    st.classList.toggle('zoom', z > 1.01);
    if (anchor._g) paint(anchor, Number(anchor.dataset.n), anchor._g, anchor._g.fit * z);
  }
  const r1 = anchor.getBoundingClientRect();
  st.scrollLeft += r1.left + px * r1.width - tx;
  st.scrollTop += r1.top + py * r1.height - ty;
  zoomLabel(z);
  if (S.settings.reader.mode === 'scroll') requestAnimationFrame(trackScroll);
}

function trackScroll() {
  const st = RD.el.querySelector('.rd-stage'), mid = st.scrollTop + st.clientHeight * 0.4;
  let n = RD.page;
  for (const box of st.querySelectorAll('.rd-page')) { if (box.offsetTop <= mid) n = Number(box.dataset.n); else break; }
  if (n !== RD.page) pageChanged(n, 'scroll');
}

async function goPage(n, how) {
  n = clamp(n, 1, RD.n);
  if (n === RD.page && how !== 'jump') return;
  if (S.settings.reader.mode === 'scroll') {
    const st = RD.el.querySelector('.rd-stage'), box = st.querySelector(`.rd-page[data-n="${n}"]`);
    if (box) st.scrollTop = box.offsetTop - 6;
    pageChanged(n, how);
  } else {
    pageChanged(n, how);
    await showPage(n);
  }
}

/** Смена страницы: запоминаем место и засчитываем прочитанное. */
function pageChanged(n, how) {
  const { b, f } = RD;
  RD.page = n;
  f.lastPage = n;
  b.lastFile = f.id;
  const bp = bookPageOf(b, f, n);
  if (bp != null && bp > b.currentPage) {
    const delta = bp - b.currentPage, lim = how === 'scroll' ? 10 : 3;
    if (how !== 'jump' && delta <= lim) countTo(bp);
  }
  scheduleSave();
  updateBars();
  if (how === 'scroll' || S.settings.reader.mode === 'scroll') sweep();
}

function countTo(bp) {
  const b = RD.b, diff = bp - b.currentPage;
  if (diff <= 0) return;
  if (b.status !== 'reading' && b.status !== 'done') setBookStatus(b, 'reading', true);
  const l = logOf(todayDate()), k = 'book_' + b.id;
  l[k] = iv(l[k]) + diff;
  b.currentPage = Math.min(bp, b.totalPages);
  if (b.currentPage >= b.totalPages && b.status !== 'done') setBookStatus(b, 'done');
}

function scheduleSave() { clearTimeout(RD.saveT); RD.saveT = setTimeout(save, 700); }

function updateBars() {
  const { el, b, f } = RD;
  if (!el) return;
  el.querySelector('.rd-num').textContent = `${RD.page} / ${RD.n}`;
  const rng = el.querySelector('.rd-range'); rng.max = String(RD.n); rng.value = String(RD.page);
  const sess = el.querySelector('.rd-sess');
  if (f.counts && b.status !== 'done') sess.textContent = t('rd.sess', { a: iv(peek(todayDate())['book_' + b.id]), g: b.dailyGoal });
  else if (f.counts) sess.textContent = t('book.finishedOn', { d: human(parseKey(b.finishedAt || dkey(todayDate()))) });
  else sess.textContent = t('rd.extra');
  const m = (b.marks || []).find(x => x.f === f.id && x.p === RD.page);
  const mk = el.querySelector('[data-r="mark"]');
  mk.classList.toggle('on', !!m); mk.style.setProperty('--c', m ? MARKS[m.c] : 'currentColor');
  // предложение засчитать при прыжке вперёд
  const pr = el.querySelector('.rd-prompt'), bp = bookPageOf(b, f, RD.page);
  if (bp != null && bp > b.currentPage + 3 && b.status !== 'done') {
    pr.hidden = false;
    pr.innerHTML = `<span>${t('rd.countQ', { n: bp })}</span><button data-r="countYes">${icon('check')}</button>`;
  } else pr.hidden = true;
  // флажок на текущей странице (постраничный режим)
  const box = el.querySelector(`.rd-page[data-n="${RD.page}"]`);
  if (box) { const old = box.querySelector('.rd-flag'); if (old) old.remove(); box.insertAdjacentHTML('afterbegin', pageMarkHtml(RD.page)); }
}

const RA = {
  close: () => closeReader(true),
  countYes: () => { const bp = bookPageOf(RD.b, RD.f, RD.page); countTo(bp); save(); updateBars(); toast(t('rd.counted', { n: bp })); },
  async mark() {
    const { b, f } = RD, cur = (b.marks || []).find(x => x.f === f.id && x.p === RD.page);
    const v = await sheet(t('rd.markTitle', { n: RD.page }), [
      ...Object.keys(MARKS).map(k => ({ v: k, label: t('mark.' + k), icon: 'flag', color: MARKS[k], sel: cur && cur.c === k })),
      ...(cur ? [{ v: '__del', label: t('rd.unmark'), icon: 'close' }] : []),
    ]);
    if (v == null) return;
    b.marks = (b.marks || []).filter(x => !(x.f === f.id && x.p === RD.page));
    if (v !== '__del') b.marks.push({ f: f.id, p: RD.page, c: v, d: dkey(new Date()) });
    save(); updateBars();
  },
  async note() {
    const sel = ((window.getSelection && String(window.getSelection())) || '').trim().replace(/\s+\n/g, '\n').slice(0, 2000);
    const { b, f } = RD, bp = bookPageOf(b, f, RD.page) ?? RD.page;
    const r = await form({ title: t('book.addNote'), fields: [
      { name: 'x', type: 'textarea', value: sel, placeholder: t('book.notePh') },
      { name: 'p', type: 'number', label: t('book.notePage'), value: bp }] });
    if (!r || !r.x) return;
    b.notes.unshift({ text: r.x, page: r.p == null || !isFinite(r.p) ? null : Math.round(r.p), date: dkey(new Date()), ...(f.counts ? {} : { src: f.name }) });
    try { window.getSelection().removeAllRanges(); } catch (e) {}
    save(); toast(t('rd.noted'));
  },
  async opts() {
    const R = S.settings.reader;
    const v = await sheet(t('rd.opts'), [
      { v: 'm:page', label: t('rd.modePage'), icon: 'book', sel: R.mode === 'page' },
      { v: 'm:scroll', label: t('rd.modeScroll'), icon: 'list', sel: R.mode === 'scroll' },
      { v: 'th:auto', label: t('rd.thAuto'), icon: 'moon', sel: R.theme === 'auto' },
      { v: 'th:light', label: t('rd.thLight'), icon: 'sun', sel: R.theme === 'light' },
      { v: 'th:sepia', label: t('rd.thSepia'), icon: 'sun', color: '#B0843A', sel: R.theme === 'sepia' },
      { v: 'th:night', label: t('rd.thNight'), icon: 'moon', sel: R.theme === 'night' },
      { v: 'crop', label: R.crop ? t('rd.cropOff') : t('rd.cropOn'), icon: 'crop', sel: R.crop },
    ]);
    if (v == null) return;
    if (v.startsWith('m:')) { R.mode = v.slice(2); save(); await layout(true); }
    else if (v.startsWith('th:')) { R.theme = v.slice(3); save(); RD.el.className = `rd t-${readerTheme()}${RD.chrome ? '' : ' immersive'}`; }
    else if (v === 'crop') { R.crop = !R.crop; save(); await layout(true); }
  },
};

// =====================================================================
//  ЖЕСТЫ: долгое нажатие (довод) и свайп (дни)
// =====================================================================
const lp = { timer: null, fired: false, x: 0, y: 0 };
document.addEventListener('pointerdown', e => {
  const el = e.target.closest('[data-info]');
  lp.fired = false;
  if (!el) return;
  lp.x = e.clientX; lp.y = e.clientY;
  clearTimeout(lp.timer);
  lp.timer = setTimeout(() => { lp.fired = true; if (navigator.vibrate) navigator.vibrate(15); showInfo(el.dataset.info); }, 520);
});
document.addEventListener('pointermove', e => { if (lp.timer && (Math.abs(e.clientX - lp.x) > 10 || Math.abs(e.clientY - lp.y) > 10)) { clearTimeout(lp.timer); lp.timer = null; } });
['pointerup', 'pointercancel'].forEach(ev => document.addEventListener(ev, () => { clearTimeout(lp.timer); lp.timer = null; }));
document.addEventListener('contextmenu', e => {
  const el = e.target.closest('[data-info]');
  if (!el) return;
  e.preventDefault();
  clearTimeout(lp.timer); lp.timer = null;
  if (!lp.fired) { lp.fired = true; showInfo(el.dataset.info); }
});

let sw = null;
app.addEventListener('touchstart', e => { if (e.touches.length === 1) sw = { x: e.touches[0].clientX, y: e.touches[0].clientY, t: Date.now() }; }, { passive: true });
app.addEventListener('touchend', e => {
  if (!sw || ui.stack.length || ui.tab !== 'today' || !S.settings.onboarded) return;
  const dx = e.changedTouches[0].clientX - sw.x, dy = e.changedTouches[0].clientY - sw.y, dt = Date.now() - sw.t;
  sw = null;
  if (Math.abs(dx) < 70 || Math.abs(dy) > 45 || dt > 600) return;
  const toPast = LANG === 'ar' ? dx < 0 : dx > 0;
  const before = ui.dayOffset;
  ui.dayOffset = Math.min(0, ui.dayOffset + (toPast ? -1 : 1));
  if (ui.dayOffset !== before) render();
}, { passive: true });

document.addEventListener('click', e => {
  if (lp.fired) { lp.fired = false; e.preventDefault(); e.stopPropagation(); return; }
  const el = e.target.closest('[data-a]');
  if (!el || el.disabled || !A[el.dataset.a]) return;
  e.preventDefault();
  A[el.dataset.a](el.dataset, el);
}, true);

// =====================================================================
//  ЗАПУСК
// =====================================================================
Object.assign(A, PA, NA);
checkAway();
let lastDay = dkey(todayDate());
setInterval(() => {
  const d = dkey(todayDate());
  if (d !== lastDay) { lastDay = d; checkAway(); scheduleWeb(); }
  if (!ui.stack.length && ui.tab === 'today' && !root.classList.contains('open') && S.settings.onboarded) render();
}, 60000);
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && !root.classList.contains('open')) { checkAway(); render(); scheduleWeb(); }
});
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}

// ярлыки на иконке приложения
const params = new URLSearchParams(location.search);
const goTo = params.get('go');
if (['today', 'lib', 'stats', 'more'].includes(params.get('tab'))) ui.tab = params.get('tab');
if (params.toString()) { try { history.replaceState(null, '', location.pathname); } catch (e) {} }

render();
scheduleWeb();

if (S.settings.onboarded && goTo) {
  const td = todayDate(), k = dkey(td);
  if (goTo === 'quran') A.countInput({ id: 'quran', d: k });
  if (goTo === 'pray' && !isExcused(td)) {
    const p = prayerTimes(new Date()), now = new Date();
    let id = FARD.find(x => !isPrayed(peek(td)[x])) || 'isha';
    if (p) { const order = [['fajr', p.fajr], ['zuhr', p.dhuhr], ['asr', p.asr], ['maghrib', p.maghrib], ['isha', p.isha]]; for (const [x, tm] of order) if (now >= tm) id = x; }
    A.fard({ id, d: k });
  }
}
if (S.settings.onboarded && !S.settings.tipInfo) {
  setTimeout(() => { if (!root.classList.contains('open')) { toast(t('tip.long')); S.settings.tipInfo = true; save(); } }, 1800);
} else if (S.settings.onboarded && !S.settings.tipRatib) {
  setTimeout(() => { if (!root.classList.contains('open')) { toast(t('tip.ratib')); S.settings.tipRatib = true; save(); } }, 1800);
}

</script>
</body>
