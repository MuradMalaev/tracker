<!doctype html>
<html lang="ru" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F3B33" id="theme-color">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Трекер</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400;0,500;0,700;1,400&family=Golos+Text:wght@400;500;600;700&family=Amiri:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap">
<style>
/* ================= ТЕМЫ ================= */
:root{
  --bg:#ECF0EB; --surface:#FBFCF9; --surface-2:#E4EAE4; --ink:#13201B; --muted:#5E6F68; --line:#D6DFD8;
  --emerald:#0F3B33; --emerald-2:#14473D; --accent:#1E6E5B; --on-accent:#FFFFFF;
  --brass:#B0843A; --brass-soft:#F1E6CC; --brass-line:#D9C08F;
  --st-jamaat:#1B7F5E; --st-ontime:#4C9A3F; --st-late:#C9891C; --danger:#B5523B;
  --n-tahajjud:#3B5DA8; --n-duha:#C9891C; --n-witr:#1E6E5B; --pink:#D88BA0;
  --shadow:0 1px 0 rgba(15,59,51,.04), 0 6px 18px -12px rgba(15,59,51,.25);
  --serif:'Alegreya', Georgia, 'Times New Roman', serif;
  --sans:'Golos Text', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
/* «Ночная»: тёмная с золотом */
:root[data-theme="night"]{
  --bg:#0A0F14; --surface:#111922; --surface-2:#19232E; --ink:#ECE6D8; --muted:#9AA4AE; --line:#243140;
  --emerald:#0D1620; --emerald-2:#152231; --accent:#D6AD63; --on-accent:#1A1408;
  --brass:#D6AD63; --brass-soft:#2B2519; --brass-line:#6B5631;
  --st-jamaat:#4FB08D; --st-ontime:#7CBF6A; --st-late:#E0A43C; --danger:#D46A52;
  --n-tahajjud:#8AA6EA; --n-duha:#E0A43C; --n-witr:#4FB08D;
  --shadow:none; color-scheme:dark;
}
/* «Песочная»: тёплая светлая */
:root[data-theme="sand"]{
  --bg:#F2ECE1; --surface:#FBF8F2; --surface-2:#EBE2D2; --ink:#2A2117; --muted:#76695B; --line:#E0D4C0;
  --emerald:#4A3423; --emerald-2:#5C4330; --accent:#93652F; --on-accent:#FFFFFF;
  --brass:#B5873E; --brass-soft:#F3E4C5; --brass-line:#D8BF92;
  --st-jamaat:#3F7F5E; --st-ontime:#6A9A3E; --st-late:#C9891C; --danger:#B5523B;
  --n-tahajjud:#4C66A8; --n-duha:#C9891C; --n-witr:#3F7F5E;
  --shadow:0 1px 0 rgba(74,52,35,.05), 0 6px 18px -12px rgba(74,52,35,.28);
}
/* «Авто»: изумрудная днём, ночная при тёмной теме системы */
@media (prefers-color-scheme: dark){
  :root:not([data-theme]){
    --bg:#0A0F14; --surface:#111922; --surface-2:#19232E; --ink:#ECE6D8; --muted:#9AA4AE; --line:#243140;
    --emerald:#0D1620; --emerald-2:#152231; --accent:#D6AD63; --on-accent:#1A1408;
    --brass:#D6AD63; --brass-soft:#2B2519; --brass-line:#6B5631;
    --st-jamaat:#4FB08D; --st-ontime:#7CBF6A; --st-late:#E0A43C; --danger:#D46A52;
    --n-tahajjud:#8AA6EA; --n-duha:#E0A43C; --n-witr:#4FB08D;
    --shadow:none; color-scheme:dark;
  }
}
:root[lang="ar"]{
  --serif:'Amiri', 'Noto Naskh Arabic', serif;
  --sans:'IBM Plex Sans Arabic', 'Segoe UI', Tahoma, system-ui, sans-serif;
}

/* ================= БАЗА ================= */
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:400 15.5px/1.5 var(--sans)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:start;-webkit-tap-highlight-color:transparent}
button:disabled{cursor:default}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
[dir="rtl"] .ic.dir{transform:scaleX(-1)}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
.grow{flex:1;min-width:0}
[data-info]{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}

main{max-width:540px;margin:0 auto;padding:4px 14px calc(96px + env(safe-area-inset-bottom,0px))}

/* ================= ШАПКА ================= */
.top{display:flex;align-items:center;gap:10px;padding:14px 2px 12px}
.top h1{font:500 29px/1.05 var(--serif);margin:0;letter-spacing:-.01em}
.top .sub{margin:4px 0 0;color:var(--muted);font-size:13.5px}
.top.page h1{font-size:23px}
.icon-btn{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);flex:none;color:var(--ink)}
.icon-btn:disabled{opacity:.35}
.icon-btn .ic{width:20px;height:20px}
.nav-days{display:flex;gap:6px}
.back-today{margin:0 0 12px}
.back-today b{color:var(--accent);font-weight:600}

/* ================= ХАДИС (михраб) ================= */
.mihrab{position:relative;margin:2px 0 14px;padding:30px 24px 16px;text-align:center;
  background:radial-gradient(90% 70% at 50% 0%, var(--brass-soft), transparent 70%), var(--surface);
  border:1px solid var(--brass-line);border-radius:999px 999px 20px 20px / 110px 110px 20px 20px;box-shadow:var(--shadow);overflow:hidden}
.mihrab::before{content:"";position:absolute;inset:6px;border:1px solid var(--brass-line);opacity:.55;
  border-radius:999px 999px 15px 15px / 104px 104px 15px 15px;pointer-events:none}
.mihrab .orn{font-family:'Amiri',serif;color:var(--brass);font-size:24px;line-height:1;margin-bottom:8px}
.mihrab blockquote{margin:0 auto;max-width:34ch;font:500 19px/1.45 var(--serif);color:var(--ink);text-wrap:balance}
:root[lang="ar"] .mihrab blockquote{font-size:24px;line-height:1.7}
.mihrab .isnad{font-size:13px;line-height:1.45;color:var(--muted);margin:0 auto 8px;max-width:40ch}
.mihrab .after{margin:12px auto 0;max-width:38ch;font:italic 400 15.5px/1.5 var(--serif);color:var(--muted)}
:root[lang="ar"] .mihrab .after{font-style:normal;font-size:18px}
.mihrab .foot{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:10px;font-size:12.5px;color:var(--brass);flex-wrap:wrap}
.mihrab .foot button{color:var(--muted);text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--brass-line)}
.mihrab .foot i{width:3px;height:3px;border-radius:50%;background:var(--brass-line)}
.mihrab.glow{animation:glow 3.2s ease-out}
@keyframes glow{0%{box-shadow:0 0 0 0 rgba(214,173,99,0)}18%{box-shadow:0 0 0 6px rgba(214,173,99,.45),0 0 38px rgba(214,173,99,.55);border-color:var(--brass)}100%{box-shadow:var(--shadow)}}
.alh{position:absolute;inset:0;display:grid;place-items:center;font:500 30px/1 var(--serif);color:var(--brass);
  background:color-mix(in srgb,var(--surface) 88%,transparent);animation:alh 3.2s ease-out forwards;pointer-events:none}
@keyframes alh{0%{opacity:0}15%{opacity:1}75%{opacity:1}100%{opacity:0}}

/* ================= НАМАЗЫ ================= */
.strip{display:grid;grid-template-columns:repeat(6,1fr);gap:5px}
.strip.five{grid-template-columns:repeat(5,1fr)}
.slot{position:relative;display:flex;flex-direction:column;align-items:center;gap:1px;padding:9px 2px 8px;border-radius:14px;
  background:var(--surface);border:1px solid var(--line);overflow:hidden;text-align:center;min-width:0}
.slot .n{font-size:11.5px;color:var(--muted);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.slot .tm{font-weight:650;font-size:15px;font-variant-numeric:tabular-nums}
.slot .mk{height:18px;display:grid;place-items:center;margin-top:2px}
.slot .mk .ring{width:16px;height:16px;border-radius:50%;border:1.5px dashed var(--line)}
.slot .mk .ic{width:16px;height:16px;stroke-width:2.3;color:var(--c)}
.slot.done{background:color-mix(in srgb,var(--c) 13%,var(--surface));border-color:color-mix(in srgb,var(--c) 35%,var(--line))}
.slot.sun{background:transparent;border-style:dashed}
.slot.sun .mk .ic{color:var(--brass)}
.slot.now{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.slot.now .n{color:var(--ink);font-weight:600}
.slot .el{position:absolute;inset-inline-start:0;bottom:0;height:3px;background:var(--brass)}
.strip.five .slot{padding:12px 4px 10px}
.strip.five .slot .lbl{font-size:11px;color:var(--muted);margin-top:2px;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.info{display:flex;flex-wrap:wrap;gap:6px 14px;margin:9px 2px 0;font-size:13.5px;color:var(--muted)}
.info span{display:inline-flex;align-items:center;gap:6px}
.info .ic{width:16px;height:16px}
.info b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.info .warn{width:100%;padding:7px 10px;border-radius:10px;background:color-mix(in srgb,var(--danger) 12%,var(--surface));color:var(--ink)}
.info .warn .ic{color:var(--danger)}
.ask-city{display:flex;align-items:center;gap:10px;width:100%;margin-top:8px;padding:10px 14px;border-radius:14px;border:1px dashed var(--line);font-size:14px;color:var(--muted)}

/* ================= ИТОГ ДНЯ ================= */
.sum{display:flex;align-items:center;gap:14px;margin:14px 0 4px;padding:12px 14px;border-radius:18px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow)}
.ring-p{width:52px;height:52px;flex:none}
.ring-p .rt{fill:none;stroke:var(--surface-2);stroke-width:5}
.ring-p .rv{fill:none;stroke:var(--accent);stroke-width:5;stroke-linecap:round;transition:stroke-dashoffset .4s ease}
.ring-p text{font:600 12.5px var(--sans);fill:var(--ink);text-anchor:middle}
.sum .t{font-weight:600}
.sum .s{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:5px}
.sum .s .ic{width:15px;height:15px;color:var(--brass)}
.toggles{display:flex;flex-direction:column;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;border:1px solid var(--line);font-size:13px;color:var(--muted);white-space:nowrap}
.chip .ic{width:15px;height:15px}
.chip.on{background:var(--brass-soft);border-color:var(--brass-line);color:var(--ink)}
.banner{display:flex;align-items:center;gap:10px;width:100%;margin:10px 0 0;padding:11px 14px;border-radius:14px;background:var(--brass-soft);font-size:14px}
.banner .ic{color:var(--brass)}
.note{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:16px;background:var(--brass-soft);font-size:14px}
.note p{margin:2px 0 0;color:var(--muted)}

/* ================= СЕКЦИИ ================= */
.sec{margin-top:10px;background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:var(--shadow)}
.sec.accent{border-color:var(--brass-line);background:linear-gradient(var(--brass-soft),var(--surface) 70%)}
.sec-h{display:flex;align-items:center;gap:10px;width:100%;padding:13px 14px 13px 16px}
.sec-h .title{font:500 18px/1.2 var(--serif)}
.sec-h .cnt{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.mini{width:42px;height:5px;border-radius:3px;background:var(--surface-2);overflow:hidden;flex:none}
.mini i{display:block;height:100%;background:var(--accent);border-radius:3px}
.sec-h .rot{width:18px;height:18px;color:var(--muted);transition:transform .2s}
.sec.open .sec-h .rot{transform:rotate(90deg)}
[dir="rtl"] .sec-h .rot{transform:scaleX(-1)}
[dir="rtl"] .sec.open .sec-h .rot{transform:rotate(90deg)}
.sec-b{padding:0 10px 10px}
.sec-note{font-size:12.5px;color:var(--muted);margin:-4px 6px 8px}
.pills{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.pill{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:12px;background:var(--surface-2);font-size:14px;line-height:1.25;min-height:44px}
.pill .pc{width:22px;height:22px;border-radius:7px;border:1.5px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none;color:transparent}
.pill .pc .ic{width:15px;height:15px;stroke-width:2.6}
.pill.on{background:color-mix(in srgb,var(--accent) 13%,var(--surface))}
.pill.on .pc{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.pill.avoid.on{background:color-mix(in srgb,var(--brass) 15%,var(--surface))}
.pill.avoid.on .pc{background:var(--brass);border-color:var(--brass)}
.pill.wide{grid-column:1/-1}
.ctr{display:flex;align-items:center;gap:10px;padding:8px 4px 8px 6px}
.pills + .ctr,.ctr + .ctr{border-top:1px solid var(--line);margin-top:6px}
.ctr .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;padding:2px 0}
.ctr .t{font-weight:500;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctr .s{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.meter{display:block;height:4px;border-radius:2px;background:var(--surface-2);overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);border-radius:2px}
.ctr.done .meter i{background:var(--st-ontime)}
.stepper{display:flex;gap:5px;flex:none;align-items:center}
.stepper button{width:36px;height:36px;border-radius:11px;background:var(--surface-2);display:grid;place-items:center}
.stepper .ic{width:18px;height:18px}
.stepper .val{min-width:52px;text-align:center;font-variant-numeric:tabular-nums;font-size:14px}

/* ================= ОБЩИЕ БЛОКИ ================= */
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;margin:10px 0;box-shadow:var(--shadow)}
.card h2{margin:0;font:500 20px/1.2 var(--serif)}
.card .hd{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.card .hd .ic{color:var(--brass)}
.kv{display:flex;justify-content:space-between;gap:12px;padding:4px 0;font-size:14.5px}
.kv b{font-weight:600;font-variant-numeric:tabular-nums;text-align:end;white-space:nowrap}
.bar{height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px;background:var(--c,var(--accent))}
.list{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;margin:10px 0;box-shadow:var(--shadow)}
.item{display:flex;align-items:center;gap:14px;padding:13px 16px;width:100%}
.item + .item{border-top:1px solid var(--line)}
.item .t{font-weight:500}
.item .s{font-size:13px;color:var(--muted)}
.item > .ic:first-child{color:var(--accent)}
.empty{padding:24px 18px;text-align:center;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 16px;border-radius:13px;font-weight:600;font-size:15px;text-align:center}
.btn.primary{background:var(--emerald);color:#FFFDF6}
:root[data-theme="night"] .btn.primary{background:var(--accent);color:var(--on-accent)}
@media (prefers-color-scheme: dark){:root:not([data-theme]) .btn.primary{background:var(--accent);color:var(--on-accent)}}
.btn.ghost{background:var(--surface-2)}
.btn.danger{background:var(--danger);color:#fff}
.btn.wide{width:100%}
.btn.sm{padding:7px 12px;font-size:13.5px;border-radius:11px}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.big{font:500 28px/1.15 var(--serif);margin:0}
.prose{font-size:14.5px;color:var(--muted);margin:6px 2px 12px;max-width:62ch}
.h2{font:500 20px/1.2 var(--serif);margin:22px 4px 4px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.h2 small{font:400 13px var(--sans);color:var(--muted)}

/* ================= БИБЛИОТЕКА ================= */
.khatm{background:linear-gradient(160deg,var(--emerald),var(--emerald-2));color:#F6F3EA;border:0}
.khatm h2{color:#FFFDF6}
.khatm .muted{color:rgba(246,243,234,.72)}
.khatm .bar{background:rgba(255,255,255,.14)}
.khatm .bar i{background:#D6AD63}
.khatm .hd .ic{color:#D6AD63}
.khatm .btn.ghost{background:rgba(255,255,255,.12);color:#FFFDF6}
.khatm .mark-line{display:flex;align-items:center;gap:10px;margin-top:12px;padding-top:12px;border-top:1px solid rgba(255,255,255,.14);width:100%}
.spine{width:10px;align-self:stretch;border-radius:4px;flex:none;min-height:44px}
.book{display:flex;gap:14px;align-items:stretch;padding:14px 16px;width:100%}
.book + .book{border-top:1px solid var(--line)}
.book .t{font-weight:600}
.book .au{font-size:13px;color:var(--muted)}
.book .s{font-size:13px;color:var(--muted);margin-top:4px;display:block}
.book .side{align-self:center}
.shelf-note{font-size:13.5px;color:var(--muted);margin:8px 4px 0}
.stars{display:inline-flex;gap:2px}
.stars button{width:30px;height:30px;display:grid;place-items:center;color:var(--line)}
.stars button.on{color:var(--brass)}
.stars .ic{width:22px;height:22px}
.stars button.on .ic{fill:currentColor}
.stars.ro .ic{width:14px;height:14px}
.stars.ro span{color:var(--line)}
.stars.ro span.on{color:var(--brass)}
.stars.ro span.on .ic{fill:currentColor}

/* ================= КАЛЕНДАРЬ ================= */
.cal-head{display:flex;align-items:center;gap:8px;margin:2px 0 12px}
.cal-head h2{flex:1;text-align:center;margin:0;font:500 21px/1.2 var(--serif)}
.wd{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;font-size:12px;color:var(--muted);text-align:center;margin-bottom:6px}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cell{aspect-ratio:1;border-radius:12px;display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums;font-size:15px;position:relative;text-align:center}
.cell.future{color:var(--muted);opacity:.45}
.cell.today{box-shadow:inset 0 0 0 2px var(--brass)}
.cell .dot{width:5px;height:5px;border-radius:50%;background:var(--pink);position:absolute;bottom:6px}

/* ================= СТАТИСТИКА ================= */
.stat-top{display:flex;gap:8px;margin:2px 0 4px}
.metric{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;box-shadow:var(--shadow)}
.metric b{display:block;font:600 22px/1.15 var(--serif);font-variant-numeric:tabular-nums}
.metric span{font-size:12.5px;color:var(--muted)}
.chips-row{display:flex;flex-wrap:wrap;gap:6px 14px;margin:2px 0 10px;font-size:13px;color:var(--muted)}
.chips-row b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:8px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:9px;height:9px;border-radius:3px;background:var(--c)}
svg.chart{display:block;width:100%;height:auto;overflow:visible;direction:ltr}
svg.chart .gl{stroke:var(--line);stroke-width:1}
svg.chart .gl.base{stroke:var(--muted);opacity:.35}
svg.chart .goal{stroke:var(--brass);stroke-width:1.2;stroke-dasharray:4 3}
svg.chart text{font-family:var(--sans);font-size:9.5px;fill:var(--muted)}
svg.chart .xl{text-anchor:middle}
svg.chart .yl{text-anchor:end}
svg.chart .rl{font-size:11px;fill:var(--ink)}
svg.heat text{font-size:7.5px;direction:ltr;unicode-bidi:plaintext}
.corr{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:9px 0}
.corr + .corr{border-top:1px solid var(--line)}
.tag{padding:4px 9px;border-radius:999px;background:var(--surface-2);font-size:13px}
.corr b{margin-inline-start:auto;color:var(--accent);font-variant-numeric:tabular-nums}
.corr .ic{width:16px;height:16px;color:var(--muted)}

/* ================= ВЕХИ ================= */
.ms{display:flex;gap:14px;padding:14px 16px;align-items:flex-start}
.ms + .ms{border-top:1px solid var(--line)}
.ms .dt{font-size:12.5px;color:var(--muted);min-width:76px;padding-top:2px}
.ms .ic{color:var(--brass);margin-top:1px}

/* ================= НАСТРОЙКИ ================= */
.set-title{font:500 19px/1.2 var(--serif);margin:24px 4px 8px}
.set{display:flex;align-items:center;gap:12px;padding:12px 16px;width:100%}
.set + .set{border-top:1px solid var(--line)}
.set .s{font-size:13px;color:var(--muted)}
.set.sub{padding-inline-start:30px;background:color-mix(in srgb,var(--surface-2) 40%,var(--surface))}
.seg{display:inline-flex;background:var(--surface-2);border-radius:12px;padding:3px;gap:2px;flex:none}
.seg button{padding:6px 11px;border-radius:9px;font-size:13.5px;color:var(--muted);white-space:nowrap;text-align:center}
.seg button.on{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(15,59,51,.15)}
.seg.full{display:flex;width:100%}
.seg.full button{flex:1}
.switch{width:46px;height:28px;border-radius:999px;background:var(--line);position:relative;flex:none;transition:background .2s}
.switch::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.switch[aria-checked="true"]{background:var(--accent)}
.switch[aria-checked="true"]::after{transform:translateX(18px)}
[dir="rtl"] .switch[aria-checked="true"]::after{transform:translateX(-18px)}
.mark{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;flex:none;border:1.5px dashed var(--line);color:var(--muted)}
.mark.is-set{border:0;background:color-mix(in srgb,var(--c) 16%,transparent);color:var(--c)}
.themes{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.theme-tile{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 4px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);font-size:12.5px;text-align:center}
.theme-tile.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);font-weight:600}
.theme-tile .sw{width:34px;height:34px;border-radius:50%;border:1px solid rgba(0,0,0,.08)}

/* ================= НАВИГАЦИЯ ================= */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:color-mix(in srgb,var(--surface) 90%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs[hidden]{display:none}
nav.tabs .in{max-width:540px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
nav.tabs button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 8px;font-size:11.5px;color:var(--muted);position:relative;text-align:center}
nav.tabs button.on{color:var(--ink);font-weight:600}
nav.tabs button.on .ic{color:var(--accent)}
nav.tabs button.on::before{content:"";position:absolute;top:0;width:26px;height:2.5px;border-radius:2px;background:var(--brass)}

/* ================= МАСТЕР НАСТРОЙКИ ================= */
.wiz{min-height:calc(100vh - 40px);display:flex;flex-direction:column;padding:18px 4px 24px}
.wiz .dots{display:flex;gap:6px;justify-content:center;margin:6px 0 22px}
.wiz .dots i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.wiz .dots i.on{background:var(--accent);width:20px;border-radius:4px}
.wiz .orn{font-family:'Amiri',serif;color:var(--brass);font-size:34px;text-align:center;line-height:1}
.wiz h1{font:500 28px/1.2 var(--serif);text-align:center;margin:14px 0 6px}
.wiz .lead{text-align:center;color:var(--muted);margin:0 auto 20px;max-width:36ch}
.wiz .opts{display:flex;flex-direction:column;gap:8px}
.wiz .opt{display:flex;align-items:center;gap:12px;padding:15px 16px;border-radius:16px;background:var(--surface);border:1.5px solid var(--line);font-size:16px;box-shadow:var(--shadow)}
.wiz .opt.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.wiz .opt small{display:block;font-size:13px;color:var(--muted)}
.wiz .opts.grid2{display:grid;grid-template-columns:1fr 1fr}
.wiz .foot{display:flex;gap:10px;margin-top:auto;padding-top:22px}

/* ================= МОДАЛЬНЫЕ ОКНА ================= */
#modal-root{position:fixed;inset:0;z-index:50;display:none}
#modal-root.open{display:block}
.scrim{position:absolute;inset:0;background:rgba(6,20,16,.45)}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:88vh;overflow:auto;background:var(--surface);border-radius:24px 24px 0 0;padding:10px 18px calc(18px + env(safe-area-inset-bottom,0px));animation:up .22s ease-out}
.sheet::before{content:"";display:block;width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 12px}
@media (min-width:640px){.sheet{left:50%;right:auto;bottom:auto;top:50%;transform:translate(-50%,-50%);width:440px;border-radius:22px;animation:none}.sheet::before{display:none}}
@keyframes up{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
.sheet h2{font:500 22px/1.2 var(--serif);margin:4px 0 12px}
.sheet .opt{display:flex;align-items:center;gap:14px;width:100%;padding:12px 6px;border-radius:12px}
.sheet .opt.sel{background:var(--surface-2)}
.sheet .opt .ic{color:var(--c,var(--muted))}
.ev{margin:0 0 14px;padding:12px 14px;border-radius:14px;background:var(--brass-soft)}
.ev blockquote{margin:0;font:400 16.5px/1.5 var(--serif)}
:root[lang="ar"] .ev blockquote{font-size:19px;line-height:1.8}
.ev cite{display:block;margin-top:6px;font-style:normal;font-size:12.5px;color:var(--brass)}
.field{display:block;margin:0 0 12px}
.field span{display:block;font-size:13px;color:var(--muted);margin:0 0 5px}
.field input,.field textarea,.field select{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:11px 12px}
.field textarea{min-height:110px;resize:vertical}
.two{display:grid;grid-template-columns:2fr 1fr;gap:10px}
.check{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--muted);margin:2px 0 6px}
.check input{width:20px;height:20px;accent-color:var(--accent)}
.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:16px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--emerald);color:#FFFDF6;padding:10px 16px;border-radius:12px;font-size:14px;z-index:60;max-width:90vw;text-align:center;box-shadow:0 8px 24px -10px rgba(0,0,0,.4)}
:root[data-theme="night"] .toast{background:#24303D}

@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
@media (max-width:370px){.slot .tm{font-size:13.5px}.slot .n{font-size:10.5px}.top h1{font-size:25px}.pill{font-size:13px}.icon-btn{width:36px;height:36px}}

/* =====================================================================
   ДИЗАЙН v4: спокойная основа + «живое небо» на плашке намазов
   ===================================================================== */
:root{ --r:20px; --hair:color-mix(in srgb,var(--line) 85%,transparent); }
body{background:var(--bg)}
main{padding:2px 16px calc(112px + env(safe-area-inset-bottom,0px))}

/* шапка */
.top{padding:16px 2px 12px}
.top h1{font-size:31px;font-weight:500}
.top .sub{font-size:13px;letter-spacing:.01em}
.icon-btn{border:0;background:var(--surface);box-shadow:0 1px 0 var(--hair),0 0 0 1px var(--hair) inset;border-radius:50%}
.nav-days{gap:4px}

/* хадис: лёгкая арка без заливки */
.mihrab{background:transparent;box-shadow:none;padding:24px 22px 12px;margin:0 0 16px;border-color:var(--brass-line)}
.mihrab::before{opacity:.4}
.mihrab .orn{font-size:20px;margin-bottom:6px}
.mihrab blockquote{font-size:18px;line-height:1.45}
:root[lang="ar"] .mihrab blockquote{font-size:22px}
.mihrab .foot{margin-top:8px}
.mihrab .alh{background:color-mix(in srgb,var(--bg) 90%,transparent)}

/* ---------- небо ---------- */
.sky{position:relative;border-radius:24px;padding:14px 10px 12px;color:#fff;overflow:hidden;isolation:isolate;
  --st-jamaat:#86E3BE; --st-ontime:#C2EC9E; --st-late:#FFD27E;
  box-shadow:0 18px 40px -26px rgba(10,20,40,.55)}
.sky::after{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;opacity:0;transition:opacity .6s}
.sky.dawn{background:linear-gradient(170deg,#1E2B57 0%,#5B4677 55%,#C9836F 100%)}
.sky.day{background:linear-gradient(170deg,#17506F 0%,#2F7A99 55%,#6FA9BC 100%)}
.sky.afternoon{background:linear-gradient(170deg,#1E4A66 0%,#7A5A45 60%,#C98A4A 100%)}
.sky.dusk{background:linear-gradient(170deg,#24193F 0%,#6C3A63 55%,#C6655A 100%)}
.sky.night{background:linear-gradient(170deg,#050913 0%,#0C1733 60%,#17254A 100%)}
.sky.night::after{opacity:1;background-image:
  radial-gradient(1px 1px at 12% 18%,rgba(255,255,255,.8),transparent 60%),radial-gradient(1px 1px at 28% 8%,rgba(255,255,255,.6),transparent 60%),
  radial-gradient(1.2px 1.2px at 47% 22%,rgba(255,255,255,.7),transparent 60%),radial-gradient(1px 1px at 66% 10%,rgba(255,255,255,.55),transparent 60%),
  radial-gradient(1px 1px at 82% 26%,rgba(255,255,255,.7),transparent 60%),radial-gradient(1px 1px at 91% 6%,rgba(255,255,255,.5),transparent 60%),
  radial-gradient(1px 1px at 38% 30%,rgba(255,255,255,.4),transparent 60%),radial-gradient(1px 1px at 7% 34%,rgba(255,255,255,.45),transparent 60%)}
.sky.plain{background:var(--surface);color:var(--ink);box-shadow:none;border:1px solid var(--hair);
  --st-jamaat:#1B7F5E; --st-ontime:#4C9A3F; --st-late:#C9891C}
:root[data-theme="night"] .sky.plain{--st-jamaat:#4FB08D; --st-ontime:#7CBF6A; --st-late:#E0A43C}
.sky-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:0 4px;font-size:14px;color:rgba(255,255,255,.82)}
.sky-head b{color:#fff;font-weight:600;font-variant-numeric:tabular-nums}
.sky-clock{font:500 22px/1 var(--serif);color:#fff;font-variant-numeric:tabular-nums}
.tl{position:relative;height:14px;margin:10px 6px 12px;direction:ltr}
[dir="rtl"] .tl{transform:scaleX(-1)}
.tl::before{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:rgba(255,255,255,.22)}
.tl-day{position:absolute;top:calc(50% - 1px);height:3px;border-radius:2px;background:rgba(255,236,190,.55)}
.tk{position:absolute;top:calc(50% - 3px);width:1.5px;height:7px;background:rgba(255,255,255,.55);transform:translateX(-50%)}
.tk.sun{background:rgba(255,226,160,.9)}
.tl-now{position:absolute;top:50%;width:11px;height:11px;border-radius:50%;transform:translate(-50%,-50%)}
.tl-now.sun{background:#FFE3A1;box-shadow:0 0 0 4px rgba(255,227,161,.25),0 0 14px rgba(255,214,130,.9)}
.tl-now.moon{background:#E8ECF7;box-shadow:0 0 0 4px rgba(232,236,247,.15),0 0 12px rgba(200,210,240,.7)}

.pgrid{display:grid;gap:5px}
.pgrid.six{grid-template-columns:repeat(6,minmax(0,1fr))}
.pgrid.five{grid-template-columns:repeat(5,minmax(0,1fr))}
.pcol{display:flex;flex-direction:column;gap:5px;min-width:0}
.rrow{height:24px;display:flex;justify-content:center;gap:3px}
.rchip{flex:0 1 40px;height:24px;border-radius:9px;display:inline-flex;align-items:center;justify-content:center;gap:2px;
  font:600 12px/1 var(--sans);border:1px dashed rgba(255,255,255,.42);color:rgba(255,255,255,.9);background:transparent;text-align:center}
.rchip .ic{width:11px;height:11px;stroke-width:3}
.rchip.on{background:#F0D08F;color:#2A1D07;border:1px solid #F0D08F}
.sky.plain .rchip{border-color:var(--line);color:var(--muted)}
.sky.plain .rchip.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}

.sky .slot{background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.14);color:#fff;border-radius:14px;padding:9px 1px 8px;backdrop-filter:blur(2px)}
.sky .slot .n{color:rgba(255,255,255,.72);font-size:11px}
.sky .slot .tm{font-size:15px;font-weight:600}
.sky .slot .mk .ring{border-color:rgba(255,255,255,.45)}
.sky .slot.done{background:color-mix(in srgb,var(--c) 26%,rgba(255,255,255,.05));border-color:color-mix(in srgb,var(--c) 55%,transparent)}
.sky .slot.now{background:rgba(255,255,255,.2);border-color:rgba(255,255,255,.5);box-shadow:none}
.sky .slot.now .n{color:#fff}
.sky .slot.sun{background:transparent;border-style:dashed;border-color:rgba(255,255,255,.22)}
.sky .slot.sun .mk .ic{color:#FFE3A1}
.sky .slot .el{background:#FFE3A1}
.sky.plain .slot{background:var(--bg);border-color:var(--hair);color:var(--ink);backdrop-filter:none}
.sky.plain .slot .n{color:var(--ink);font-weight:600;font-size:12px}
.sky.plain .slot .mk .ring{border-color:var(--line)}
.sky.plain .slot.done{background:color-mix(in srgb,var(--c) 13%,var(--surface));border-color:color-mix(in srgb,var(--c) 40%,var(--line))}
.sky.plain .slot{padding:12px 3px 10px}
.sky-foot{display:flex;flex-wrap:wrap;gap:6px 14px;margin:12px 4px 0;font-size:13px;color:rgba(255,255,255,.8)}
.sky-foot span{display:inline-flex;align-items:center;gap:6px}
.sky-foot .ic{width:15px;height:15px}
.sky-foot b{color:#fff;font-weight:600;font-variant-numeric:tabular-nums}
.sky-foot .warn{width:100%;padding:7px 10px;border-radius:11px;background:rgba(255,120,100,.2);color:#fff}
.sky-foot .warn .ic{color:#FFB4A6}

/* итог дня: строка без карточки */
.sum{background:transparent;border:0;box-shadow:none;padding:14px 4px 4px;margin:0;gap:12px}
.ring-p{width:46px;height:46px}
.toggles{flex-direction:row;gap:6px}
.chip{padding:6px 10px;background:transparent}

/* секции: тонкие линии вместо теней */
.sec{box-shadow:none;border-color:var(--hair);border-radius:var(--r);margin-top:12px}
.sec-h{padding:14px 14px 12px 16px}
.sec-h .title{font-size:19px}
.mini{width:36px;height:4px}
.pill{background:transparent;border:1px solid var(--hair);min-height:46px;border-radius:13px}
.pill .pc{border-radius:50%;background:transparent}
.pill.on{background:color-mix(in srgb,var(--accent) 10%,var(--surface));border-color:color-mix(in srgb,var(--accent) 35%,var(--hair))}
.pill.avoid.on{border-color:color-mix(in srgb,var(--brass) 45%,var(--hair))}
.ctr .stepper button,.stepper button{background:transparent;border:1px solid var(--hair);border-radius:50%}
.card,.list,.metric{box-shadow:none;border-color:var(--hair);border-radius:var(--r)}
.khatm{border-radius:24px}
.banner{background:transparent;border:1px solid var(--brass-line)}
.note{background:transparent;border:1px solid var(--brass-line)}

/* нижняя навигация — плавающая */
nav.tabs{left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));padding-bottom:0;border:1px solid var(--hair);border-radius:22px;
  background:color-mix(in srgb,var(--surface) 86%,transparent);box-shadow:0 14px 34px -18px rgba(10,20,30,.45);max-width:520px;margin:0 auto}
nav.tabs .in{max-width:none}
nav.tabs button{padding:10px 0 9px}
nav.tabs button.on::before{top:auto;bottom:4px;width:4px;height:4px;border-radius:50%}
.toast{bottom:calc(92px + env(safe-area-inset-bottom,0px))}

/* окно выбора статуса */
.st-pick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:4px 0 10px}
.stp{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:92px;border-radius:18px;
  border:1px solid var(--hair);background:var(--bg);font-size:13.5px;font-weight:500;text-align:center;padding:10px 6px}
.stp .ic{width:26px;height:26px;color:var(--c);stroke-width:2}
.stp:active{transform:scale(.97)}
.stp.on{background:color-mix(in srgb,var(--c) 16%,var(--surface));border-color:var(--c)}
.stp-clear{display:flex;align-items:center;gap:8px;margin:0 auto 6px;color:var(--muted);font-size:14px;padding:8px 10px}
.stp-clear .ic{width:16px;height:16px}
details.why{margin-top:8px;border-top:1px solid var(--hair);padding-top:8px}
details.why summary{display:flex;align-items:center;gap:8px;cursor:pointer;color:var(--brass);font-size:14px;padding:6px 2px;list-style:none}
details.why summary::-webkit-details-marker{display:none}
details.why summary .ic{width:17px;height:17px}
details.why .ev{margin:8px 0 0}
.ev{background:transparent;border:1px solid var(--brass-line);border-radius:16px}
.sheet{border-radius:28px 28px 0 0}
@media (min-width:640px){.sheet{border-radius:24px}}
@media (max-width:370px){.rchip{font-size:11px;height:22px}.rrow{height:22px}.sky .slot .tm{font-size:13.5px}.sky-clock{font-size:19px}}

/* =====================================================================
   v5: заметные отметки на небе, обложки, иллюстрации
   ===================================================================== */
/* отмеченный намаз — светлая плитка, хорошо видна на любом небе */
.sky .slot.done{background:rgba(255,253,247,.94);border-color:transparent;color:#13201B;
  --st-jamaat:#147A58; --st-ontime:#3B8A2F; --st-late:#B8770C;
  box-shadow:0 6px 16px -10px rgba(0,0,0,.6)}
.sky .slot.done .n{color:#55655F}
.sky .slot.done .mk .ic{width:17px;height:17px;stroke-width:2.6}
.sky .slot.done::after{content:"";position:absolute;top:6px;inset-inline-end:6px;width:6px;height:6px;border-radius:50%;background:var(--c)}
.sky .slot.done.now{box-shadow:0 0 0 2px #FFE3A1,0 6px 16px -10px rgba(0,0,0,.6)}
.sky .slot.done .el{background:var(--c)}
.sky .rchip.on{box-shadow:0 4px 10px -6px rgba(0,0,0,.6)}

/* силуэт мечети на небе */
.skyline{position:absolute;left:0;right:0;bottom:0;width:100%;height:56px;color:#fff;opacity:.09;z-index:-1;pointer-events:none}
.sky.night .skyline{opacity:.13}
.sky.dusk .skyline,.sky.dawn .skyline{color:#1a0f25;opacity:.22}

/* иллюстрации */
.art{display:block;color:var(--brass)}
.khatm{position:relative;overflow:hidden}
.khatm .art{position:absolute;top:12px;inset-inline-end:10px;width:108px;height:auto;color:#D6AD63;opacity:.95;pointer-events:none}
.khatm-big{font:500 40px/1 var(--serif);margin:2px 0 0;color:#FFFDF6}
.khatm-big small{font-size:20px;color:rgba(246,243,234,.7);margin-inline-start:2px}
.khatm-pitch{margin:0 0 14px}
.empty-art{display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px;padding:26px 20px 22px;margin:12px 0;
  border:1px dashed var(--brass-line);border-radius:var(--r)}
.empty-art .art{width:112px;height:auto;opacity:.9}
.empty-art p{margin:0;color:var(--muted);max-width:34ch;font-size:14.5px}
.page-art{display:flex;justify-content:center;margin:-4px 0 4px}
.page-art .art{width:44px;height:auto;opacity:.7}
.wiz-art{color:var(--accent);opacity:.18;margin:-6px -4px 8px;height:64px;overflow:hidden}
.wiz-art .skyline{position:static;opacity:1;height:64px;color:inherit}

/* обложки */
.cover{position:relative;display:block;aspect-ratio:2/3;width:100%;border-radius:6px 10px 10px 6px;overflow:hidden;flex:none;
  box-shadow:0 1px 0 rgba(0,0,0,.05),0 10px 20px -14px rgba(0,0,0,.55),inset 3px 0 0 rgba(0,0,0,.12)}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.cover::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.18),transparent 9%,rgba(255,255,255,.07) 11%,transparent 16%);pointer-events:none}
.cover.gen{background:var(--cv);color:#FFF8E8;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:12% 10%;text-align:center}
.cover.gen::before{content:"";position:absolute;inset:6%;border:1px solid rgba(255,240,200,.45);border-radius:4px;pointer-events:none}
.cv-orn{font-family:'Amiri',serif;color:#F0D08F;font-size:1.1em;line-height:1}

.si-t{font-size:13px;font-weight:500;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.si-s{font-size:12px;color:var(--muted)}
.book-hero{display:flex;gap:18px;align-items:flex-end;margin:4px 2px 16px}
.bh-side{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:8px}
.bh-au{margin:0;color:var(--muted);font-size:14px}
.bh-pct{font:500 38px/1 var(--serif);margin:0}

.link-btn{font-size:13px;color:var(--muted);text-decoration:underline;text-underline-offset:3px;padding:2px 0}
.file-in{padding:9px!important;font-size:14px}

/** Уменьшает выбранное фото до 300×450 (2:3) и сжимает в JPEG, чтобы не переполнить хранилище. */
async function toCover(file) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((ok, err) => { const i = new Image(); i.onload = () => ok(i); i.onerror = err; i.src = url; });
    const W = 300, H = 450, r = W / H;
    let sw = img.naturalWidth, sh = img.naturalHeight, sx = 0, sy = 0;
    if (sw / sh > r) { const nw = sh * r; sx = (sw - nw) / 2; sw = nw; } else { const nh = sw / r; sy = (sh - nh) / 2; sh = nh; }
    const c = document.createElement('canvas'); c.width = W; c.height = H;
    const ctx = c.getContext('2d'); ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(img, sx, sy, sw, sh, 0, 0, W, H);
    return c.toDataURL('image/jpeg', 0.8);
  } finally { URL.revokeObjectURL(url); }
}

}

//  РАСЧЁТ ВРЕМЕНИ НАМАЗОВ (астрономия, офлайн)
// =====================================================================
const PT = (() => {
  const dtr = d => d * Math.PI / 180, rtd = r => r * 180 / Math.PI;
  const sin = d => Math.sin(dtr(d)), cos = d => Math.cos(dtr(d)), tan = d => Math.tan(dtr(d));
  const arcsin = x => rtd(Math.asin(x)), arccos = x => rtd(Math.acos(x));
  const arctan2 = (y, x) => rtd(Math.atan2(y, x)), arccot = x => rtd(Math.atan(1 / x));
  const fix = (a, b) => { a = a - b * Math.floor(a / b); return a < 0 ? a + b : a; };
  const julian = (y, m, d) => {
    if (m <= 2) { y -= 1; m += 12; }
    const A = Math.floor(y / 100), B = 2 - A + Math.floor(A / 4);
    return Math.floor(365.25 * (y + 4716)) + Math.floor(30.6001 * (m + 1)) + d + B - 1524.5;
  };
  const sunPos = jd => {
    const D = jd - 2451545.0;
    const g = fix(357.529 + 0.98560028 * D, 360);
    const q = fix(280.459 + 0.98564736 * D, 360);
    const L = fix(q + 1.915 * sin(g) + 0.020 * sin(2 * g), 360);
    const e = 23.439 - 0.00000036 * D;
    const RA = arctan2(cos(e) * sin(L), cos(L)) / 15;
    return { decl: arcsin(sin(e) * sin(L)), eqt: q / 15 - fix(RA, 24) };
  };
  const GUESS = { fajr: 5, sunrise: 6, dhuhr: 12, asr: 13, sunset: 18, isha: 18 };
  return function compute(date, lat, lng, M, hanafi) {
    const y = date.getFullYear(), mo = date.getMonth(), d = date.getDate();
    const tz = -new Date(y, mo, d, 12).getTimezoneOffset() / 60;
    const jDate = julian(y, mo + 1, d) - lng / (15 * 24);
    const midDay = t => fix(12 - sunPos(jDate + t).eqt, 24);
    const angleTime = (angle, t, ccw) => {
      const { decl } = sunPos(jDate + t);
      const v = (-sin(angle) - sin(decl) * sin(lat)) / (cos(decl) * cos(lat));
      if (v < -1 || v > 1) return NaN;
      const h = arccos(v) / 15;
      return midDay(t) + (ccw ? -h : h);
    };
    const asrTime = (f, t) => { const { decl } = sunPos(jDate + t); return angleTime(-arccot(f + tan(Math.abs(lat - decl))), t); };
    let T = { ...GUESS };
    for (let i = 0; i < 2; i++) {
      const p = k => (isNaN(T[k]) ? GUESS[k] : T[k]) / 24;
      T = {
        fajr: angleTime(M.fajr, p('fajr'), true), sunrise: angleTime(0.833, p('sunrise'), true),
        dhuhr: midDay(p('dhuhr')), asr: asrTime(hanafi ? 2 : 1, p('asr')),
        sunset: angleTime(0.833, p('sunset')), isha: M.ishaMin ? NaN : angleTime(M.isha, p('isha')),
      };
    }
    const adj = tz - lng / 15;
    for (const k in T) T[k] += adj;
    const diff = (a, b) => fix(b - a, 24);
    const night = diff(T.sunset, T.sunrise);
    const fp = night * M.fajr / 60;
    if (isNaN(T.fajr) || diff(T.fajr, T.sunrise) > fp) T.fajr = T.sunrise - fp;
    if (M.ishaMin) T.isha = T.sunset + M.ishaMin / 60;
    else { const ip = night * M.isha / 60; if (isNaN(T.isha) || diff(T.sunset, T.isha) > ip) T.isha = T.sunset + ip; }
    const at = h => new Date(y, mo, d, 0, Math.round(h * 60));
    return { fajr: at(T.fajr), sunrise: at(T.sunrise), zenith: at(T.dhuhr), dhuhr: at(T.dhuhr + 1 / 60), asr: at(T.asr), maghrib: at(T.sunset), isha: at(T.isha) };
  };
})();

  const st = s.settings;
  st.offsets = { ...S0.settings.offsets, ...(st.offsets || {}) };

  // старая логика «каза» убрана: такие отметки считаем «с опозданием»
  for (const l of Object.values(s.logs || {})) for (const id of FARD) if (l[id] === 'qada') l[id] = 'late';
  // город из старой версии
  if (st.cityId == null && st.cityName) {
    const i = CITIES.findIndex(c => c.ru === st.cityName);
    if (i >= 0) st.cityId = i;
  }
  // книги: полки и даты
  s.books = (s.books || []).map(b => ({ status: 'reading', author: '', startedAt: null, finishedAt: null, rating: 0, notes: [], ...b }));

  s.milestones = s.milestones || [];

function prayerTimes(date) {
  const st = S.settings;
  if (st.lat == null || st.lng == null) return null;
  const k = dkey(date);
  if (!ptCache[k]) {
    const raw = PT(date, st.lat, st.lng, METHODS[st.method] || METHODS.mwl, st.hanafiAsr);
    const o = st.offsets;
    ptCache[k] = {
      fajr: addMin(raw.fajr, o.fajr), sunrise: addMin(raw.sunrise, o.sunrise), dhuhr: addMin(raw.dhuhr, o.zuhr),
      asr: addMin(raw.asr, o.asr), maghrib: addMin(raw.maghrib, o.maghrib), isha: addMin(raw.isha, o.isha), raw,
    };
  }
  return ptCache[k];
}
function nightWindow(now = new Date()) {
  const p = prayerTimes(now);

  if (now < p.fajr) return [prayerTimes(addDays(dateOnly(now), -1)).maghrib, p.fajr];
  return [p.maghrib, prayerTimes(addDays(dateOnly(now), 1)).fajr];
}

  };
  const L = [];
  if (!exc) {
    L.push(T('fajr', 'fard', { kind: 'fard', note: rak(2) }), T('zuhr', 'fard', { kind: 'fard', note: rak(4, safar) }),
      T('asr', 'fard', { kind: 'fard', note: rak(4, safar) }), T('maghrib', 'fard', { kind: 'fard', note: rak(3) }),
      T('isha', 'fard', { kind: 'fard', note: rak(4, safar) }));
    L.push(T('r_fajr', 'ratib'));
    if (!safar) L.push(T('r_zuhr_b', 'ratib'), T('r_zuhr_a', 'ratib', { p: { n: st.zuhrAfter } }),
      T('r_asr', 'ratib'), T('r_maghrib', 'ratib'), T('r_isha', 'ratib'));
    L.push(T('duha', 'nafl'), T('tahajjud', 'nafl'), T('witr', 'nafl'));
  }
  L.push(T('quran', 'read', { kind: 'counter', goal: quranGoalFor(d), unit: t('u.p') }));
  S.books.filter(b => b.status === 'reading').forEach(b =>
    L.push(T('book_' + b.id, 'read', { title: b.title, short: b.title, kind: 'counter', goal: b.dailyGoal, unit: t('u.p') })));
  if (st.fridayMode && d.getDay() === 5) L.push(T('fr_kahf', 'friday'), T('fr_salawat', 'friday'), T('fr_ghusl', 'friday'));
  S.customs.forEach(c => L.push(T('c_' + c.id, 'custom', { title: c.title, short: c.title, ...(c.counter ? { kind: 'counter', goal: c.target, unit: c.unit } : {}) })));
  L.push(T('azkar_m', 'azkar'), T('azkar_e', 'azkar'));
  if (st.smallSunnas) SMALL.forEach(id => L.push(T(id, 'small')));
  if (st.sleepSunnas) SLEEP.forEach(id => L.push(T(id, 'sleep')));
  S.avoids.forEach(a => L.push(T('a_' + a.id, 'avoid', { title: a.title, short: a.title, kind: 'avoid' })));

}
const findTask = (d, id) => tasksFor(d).find(x => x.id === id);
function isDone(x, log) {
  const v = log[x.id];
  if (x.kind === 'fard') return isPrayed(v);
  if (x.kind === 'counter') return iv(v) >= x.goal;
  return v === true;
}
function progress(d) {
  const ts = tasksFor(d); if (!ts.length) return 0;
  const l = peek(d);
  return ts.filter(x => isDone(x, l)).length / ts.length;
}
const bookFor = id => S.books.find(b => 'book_' + b.id === id);

// ---------- хатм ----------
function khatmTodayGoal() {
  const td = todayDate(), st = S.settings;
  const remaining = 604 - (st.khatmPage - iv(peek(td).quran));
  const end = st.khatmEnd ? parseKey(st.khatmEnd) : td;
  return Math.max(1, Math.ceil(remaining / Math.max(1, daysBetween(td, end) + 1)));
}
function quranGoalFor(d) {
  const st = S.settings;
  if (!st.khatmActive) return st.quranGoal;
  if (isToday(d)) return khatmTodayGoal();
  const saved = iv(peek(d)._qgoal);
  return saved > 0 ? saved : st.quranGoal;
}

// ---------- книги ----------
function bookPace(b) {
  const td = todayDate(); let sum = 0;
  for (let i = 0; i < 14; i++) sum += iv(peek(addDays(td, -i))['book_' + b.id]);
  return sum / 14;
}
function bookForecast(b) {
  const left = b.totalPages - b.currentPage;
  if (left <= 0) return null;
  const pace = bookPace(b), rate = pace > 0 ? pace : b.dailyGoal;
  if (!(rate > 0)) return null;
  return { date: addDays(todayDate(), Math.ceil(left / rate)), byPace: pace > 0 };
}
function setBookStatus(b, status, silent) {
  const td = dkey(todayDate());
  if (status === 'reading' && !b.startedAt) b.startedAt = td;
  if (status === 'done') {
    b.currentPage = b.totalPages;
    b.finishedAt = td;
    if (!b.startedAt) b.startedAt = td;
    addMilestone('book-' + b.id, { type: 'book', title: b.title });
    if (!silent) toast(t('book.finishedToast'));
  } else b.finishedAt = null;
  b.status = status;
}

// ---------- действия с днём ----------
function setFard(d, id, status) {
  const l = logOf(d);
  if (status) l[id] = status; else delete l[id];
  commit(true);
}
function toggleTask(d, id) { const l = logOf(d); l[id] = !(l[id] === true); commit(); }
function bumpQuranBookmark(delta) {
  const q = S.quran;
  if (q.page == null) return;
  q.page = clamp(q.page + delta, 0, 604);
  const s = suraForPage(Math.max(1, q.page));
  if (s !== q.sura) { q.sura = s; q.ayah = 1; }
}
function addCount(d, x, delta) {
  const l = logOf(d), cur = iv(l[x.id]), next = Math.max(0, cur + delta), diff = next - cur;
  l[x.id] = next;
  if (x.id === 'quran') { addKhatm(diff, d); bumpQuranBookmark(diff); }
  const b = bookFor(x.id);
  if (b) {
    b.currentPage = clamp(b.currentPage + diff, 0, b.totalPages);
    if (b.currentPage >= b.totalPages && b.status !== 'done') setBookStatus(b, 'done');
  }
  commit();
}
function addKhatm(diff, d) {
  const st = S.settings;
  if (!st.khatmActive || !diff) return;
  const before = st.khatmPage;
  st.khatmPage = clamp(st.khatmPage + diff, 0, 604);
  if (isToday(d)) logOf(d)._qgoal = khatmTodayGoal();
  if (before < 604 && st.khatmPage >= 604) {
    const n = S.milestones.filter(m => m.type === 'khatm').length + 1;
    addMilestone('khatm-' + n, { type: 'khatm', n });
  }
}
function setSafar(d, v) { logOf(d)._safar = v; if (isToday(d)) S.settings.safar = v; commit(true); }
function setExcused(d, v) { logOf(d)._excused = v; commit(true); }

// ---------- статистика ----------
function fardStreak() {
  const ok = x => FARD.every(id => isPrayed(peek(x)[id]));
  let d = todayDate();
  if (!ok(d) && !isExcused(d)) d = addDays(d, -1);
  let n = 0;
  for (let g = 0; g < 5000; g++) {
    if (isExcused(d)) { d = addDays(d, -1); continue; }
    if (!ok(d)) break;
    n++; d = addDays(d, -1);
  }
  return n;
}

// ---------- вехи ----------
let freshMilestones = [];
function addMilestone(key, data) {
  if (S.milestones.some(m => m.key === key)) return;
  const m = { id: uid(), key, date: dkey(todayDate()), ...data };
  S.milestones.push(m);
  freshMilestones.push(m);
}
function checkMilestones() {
  const s = fardStreak();
  for (const n of [7, 30, 100, 365]) if (s >= n) addMilestone('streak' + n, { type: 'streak', n });
  if (progress(todayDate()) === 1) addMilestone('perfect1', { type: 'perfect' });
  const tah = Object.values(S.logs).filter(l => l.tahajjud === true).length;
  for (const n of [10, 40, 100]) if (tah >= n) addMilestone('tah' + n, { type: 'tahajjud', n });
}
function msText(m) {
  switch (m.type) {
    case 'streak': return t('ms.streak', { n: nDays(m.n) });
    case 'khatm': return m.n === 1 ? t('ms.khatm1') : t('ms.khatmN', { n: m.n });
    case 'book': return t('ms.book', { title: esc(m.title) });
    case 'goal': return t('ms.goal', { title: esc(m.title) });
    case 'perfect': return t('ms.perfect');
    case 'tahajjud': return t('ms.tahajjud', { n: `${m.n} ${pl(m.n, 'night')}` });
    default: return esc(m.text || '');
  }
}

let timers = [];
const canNotify = () => 'Notification' in window;
async function askNotify() {
  try { if (canNotify() && Notification.permission === 'default') await Notification.requestPermission(); } catch (e) {}
}
function notify(title, body) {
  try {
    if (!canNotify() || Notification.permission !== 'granted') return;
    if (navigator.serviceWorker && navigator.serviceWorker.controller) {
      navigator.serviceWorker.ready.then(r => r.showNotification(title, { body, icon: 'icon-192.png', tag: title }));
    } else new Notification(title, { body });
  } catch (e) {}
}
function scheduleWeb() {
  timers.forEach(clearTimeout); timers = [];
  const st = S.settings;
  if (st.lat == null) return;
  const now = new Date(), today = dateOnly(now);
  const at = (when, fn) => { const ms = when - now; if (ms > 0 && ms < 36 * 3600e3) timers.push(setTimeout(fn, ms)); };
  if (st.remindFard) {
    for (const off of [0, 1]) {
      const date = addDays(today, off), p = prayerTimes(date), pn = prayerTimes(addDays(date, 1));
      const ends = { fajr: p.sunrise, zuhr: p.asr, asr: p.maghrib, maghrib: p.isha, isha: pn.fajr };
      for (const [id, end] of Object.entries(ends)) {
        at(addMin(end, -st.remindMinutes), () => {
          if (isExcused(date) || isPrayed(peek(date)[id])) return;
          notify(t('n.fardTitle', { name: t('task.' + id) }), t('n.fardBody', { m: st.remindMinutes }));
        });
      }
    }
  }
  if (st.tahajjudAlarm) {
    const w = nightWindow(now);
    let third = lastThird(w[0], w[1]);
    if (third <= now) third = lastThird(prayerTimes(today).maghrib, prayerTimes(addDays(today, 1)).fajr);
    at(third, () => notify(t('n.tahTitle'), t('n.tahBody')));
  }
  if (st.sleepReminder) {
    let x = addMin(prayerTimes(today).isha, st.sleepAfterIsha);
    if (x <= now) x = addMin(prayerTimes(addDays(today, 1)).isha, st.sleepAfterIsha);
    at(x, () => notify(t('n.sleepTitle'), t('n.sleepBody')));
  }
}

const root = $('#modal-root');
let modalResolve = null;
function openModal(html) {
  if (modalResolve) { const r = modalResolve; modalResolve = null; r(null); }
  root.innerHTML = `<div class="scrim"></div><div class="sheet" role="dialog" aria-modal="true">${html}</div>`;
  root.classList.add('open');
  root.querySelector('.scrim').onclick = () => closeModal(null);
}
function closeModal(v) {
  root.classList.remove('open'); root.innerHTML = '';
  const r = modalResolve; modalResolve = null; if (r) r(v);
}
document.addEventListener('keydown', e => { if (e.key === 'Escape' && root.classList.contains('open')) closeModal(null); });

function fieldHtml(f) {
  const v = esc(f.value ?? '');
  let input;
  if (f.type === 'textarea') input = `<textarea name="${f.name}" placeholder="${esc(f.placeholder || '')}">${v}</textarea>`;
  else if (f.type === 'select') input = `<select name="${f.name}">${f.options.map(([k, l]) => `<option value="${esc(k)}" ${String(k) === String(f.value) ? 'selected' : ''}>${esc(l)}</option>`).join('')}</select>`;
  else if (f.type === 'file') input = `<input name="${f.name}" type="file" accept="image/*" class="file-in">`;
  else input = `<input name="${f.name}" type="${f.type === 'number' ? 'text' : (f.type || 'text')}" ${f.type === 'number' ? 'inputmode="decimal"' : ''} value="${v}" placeholder="${esc(f.placeholder || '')}" autocomplete="off">`;
  return `<label class="field"><span>${esc(f.label || '')}</span>${input}</label>`;
}
function form({ title, text, fields = [], submit, danger = false }) {
  return new Promise(res => {
    openModal(`<form novalidate><h2>${esc(title)}</h2>${text ? `<p class="prose">${esc(text)}</p>` : ''}
      ${fields.map(fieldHtml).join('')}
      <div class="actions"><button type="button" class="btn ghost" data-cancel>${t('b.cancel')}</button>
      <button class="btn ${danger ? 'danger' : 'primary'}">${esc(submit || t('b.save'))}</button></div></form>`);
    modalResolve = res;
    const f = root.querySelector('form');
    root.querySelector('[data-cancel]').onclick = () => closeModal(null);
    f.onsubmit = e => {
      e.preventDefault();
      const out = {};
      fields.forEach(fd => {
        if (fd.type === 'file') { out[fd.name] = f.elements[fd.name].files[0] || null; return; }
        const raw = f.elements[fd.name].value.trim();
        out[fd.name] = fd.type === 'number' ? (raw === '' ? null : Number(raw.replace(',', '.'))) : raw;
      });
      closeModal(out);
    };
    setTimeout(() => f.querySelector('input,textarea,select')?.focus(), 60);
  });
}
const confirmBox = (title, ok) => form({ title, submit: ok || t('b.delete'), danger: true }).then(r => r !== null);
const ask = (title, value, label = '') => form({ title, fields: [{ name: 'n', type: 'number', value, label }], submit: t('b.done') })
  .then(r => r && r.n != null && isFinite(r.n) ? Math.round(r.n) : null);
const askText = (title, placeholder = '', multiline = false) => form({ title, fields: [{ name: 'x', type: multiline ? 'textarea' : 'text', placeholder }] })
  .then(r => r && r.x ? r.x : null);

    openModal(`<h2>${esc(title)}</h2>${extra}${opts.map((o, i) => `<button class="opt ${o.sel ? 'sel' : ''}" data-i="${i}" style="--c:${o.color || 'var(--muted)'}">${o.icon ? icon(o.icon) : ''}<span>${esc(o.label)}</span></button>`).join('')}`);
    modalResolve = res;
    root.querySelectorAll('.opt').forEach(b => b.onclick = () => closeModal(opts[+b.dataset.i].v));

}
function toast(msg) {
  document.querySelectorAll('.toast').forEach(x => x.remove());
  const el = document.createElement('div');

}

/** Окно закладки Корана: страница, сура, аят. */
function quranDialog() {
  return new Promise(res => {
    const q = S.quran, first = q.page == null;
    const page = first ? '' : q.page, sura = q.sura || 1, ayah = q.ayah || 1;
    openModal(`<form novalidate><h2>${t('q.title')}</h2><p class="prose">${first ? t('q.hintFirst') : t('q.hint')}</p>

    };
    setTimeout(() => f.elements.page.focus(), 60);

}
async function readQuranTo(d, r) {

    else {
      const again = await form({ title: t('q.wrapTitle'), text: t('q.wrapText', { a: old, b: r.page }), submit: t('q.wrapYes') });
      diff = again ? (604 - old) + r.page : 0;
    }
  }
  if (diff > 0) {
    const l = logOf(d);
    l.quran = iv(l.quran) + diff;
    addKhatm(diff, d);
  }
  S.quran = { page: r.page, sura: r.sura, ayah: r.ayah };
  commit();
  toast(diff > 0 ? t('q.added', { n: diff }) : (r.first ? t('q.savedFirst') : t('q.saved')));
}

function applyTheme() {
  const th = S.settings.theme;
  if (th === 'auto') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme', th);
  const bg = getComputedStyle(document.documentElement).getPropertyValue('--emerald').trim();
  const meta = $('#theme-color'); if (meta && bg) meta.setAttribute('content', bg);
}

function render() {
  applyLang();
  applyTheme();
  if (!S.settings.onboarded) { nav.hidden = true; app.innerHTML = viewWizard(); return; }
  nav.hidden = false;
  const top = ui.stack[ui.stack.length - 1];
  app.innerHTML = top ? page(top) : tab(ui.tab);
  const tabs = [['today', 'home'], ['lib', 'book'], ['stats', 'chart'], ['more', 'more']];
  nav.innerHTML = `<div class="in">${tabs.map(([k, i]) => {
    const on = !top && ui.tab === k;
    return `<button data-a="tab" data-v="${k}" class="${on ? 'on' : ''}" ${on ? 'aria-current="page"' : ''}>${icon(i)}<span>${t('tab.' + k)}</span></button>`;
  }).join('')}</div>`;
  if (!top && ui.tab === 'today' && ui.dayOffset === 0) ui.lastP = progress(todayDate());
}
function go(view, param) { ui.stack.push({ view, param }); render(); window.scrollTo(0, 0); }
function back() { ui.stack.pop(); render(); }
const pageTop = (title, extra = '') => `<header class="top page"><button class="icon-btn" data-a="back" aria-label="${t('a.back')}">${icon('back', 'dir')}</button><h1 class="grow">${esc(title)}</h1>${extra}</header>`;

function tab(x) {
  if (x === 'lib') return viewLibrary();
  if (x === 'stats') return viewStats();
  if (x === 'more') return viewMore();
  return viewToday();
}
function page({ view, param }) {
  switch (view) {
    case 'calendar': return pageTop(t('cal.title')) + viewCalendar();
    case 'khatm': return viewKhatm();
    case 'book': return viewBook(param);
    case 'goals': return viewGoals();
    case 'duas': return viewDuas();
    case 'items': return viewItems();
    case 'milestones': return viewMilestones();
    case 'settings': return viewSettings();
  }
  return '';
}

function viewToday() {
  const base = todayDate(), d = addDays(base, ui.dayOffset), isT = ui.dayOffset === 0, h = hijri(d);
  return `<header class="top">
      <div class="grow"><h1>${human(d)}</h1><p class="sub">${wdLong(d)}${h ? `, ${esc(h)}` : ''}</p></div>
      <div class="nav-days">
        <button class="icon-btn" data-a="dayMove" data-v="-1" aria-label="${t('a.prevDay')}">${icon('back', 'dir')}</button>
        <button class="icon-btn" data-a="dayMove" data-v="1" ${isT ? 'disabled' : ''} aria-label="${t('a.nextDay')}">${icon('chev', 'dir')}</button>
        <button class="icon-btn" data-a="open" data-v="calendar" aria-label="${t('a.calendar')}">${icon('cal')}</button>
      </div>
    </header>
    ${isT ? '' : `<button class="banner back-today" data-a="dayToday">${icon('replay')}<span class="grow">${ui.dayOffset === -1 ? t('day.yesterday') : t('day.past')}</span><b>${t('day.toToday')}</b></button>`}
    ${isT ? hadithCard() : ''}
    ${viewDayBody(d)}
    ${isT && d.getDay() === 5 ? `<button class="banner" data-a="tab" data-v="stats">${icon('chart')}<span class="grow">${t('day.fridayStats')}</span>${icon('chev', 'dir')}</button>` : ''}`;
}

function hadithCard() {
  const open = S.settings.hadithOpen, glow = Date.now() < ui.glowUntil;
  return `<section class="mihrab ${glow ? 'glow' : ''}" aria-label="${t('hadith.label')}">
    <div class="orn" aria-hidden="true">۞</div>
    ${open ? `<p class="isnad">${t('hadith.isnad')}</p>` : ''}
    <blockquote>${t('hadith.text')}</blockquote>
    ${open ? `<p class="after">${t('hadith.after')}</p>` : ''}
    <div class="foot"><span>${t('hadith.src')}</span><i></i><button data-a="hadith">${open ? t('hadith.less') : t('hadith.more')}</button></div>
    ${glow ? `<div class="alh" role="status">${t('hadith.alh')}</div>` : ''}
  </section>`;
}

function viewDayBody(d) {
  return `${fardStrip(d)}${summary(d)}${fridayNight(d)}${sections(d)}`;
}

/** Время суток для цвета неба на плашке. */
function skyPeriod(now, p) {
  if (now < p.fajr || now >= addMin(p.isha, 20)) return 'night';
  if (now < addMin(p.sunrise, 30)) return 'dawn';
  if (now < p.asr) return 'day';
  if (now < addMin(p.maghrib, -25)) return 'afternoon';
  return 'dusk';
}

/** Плашка намазов: фард в центре, ратибаты сверху (до) и снизу (после). */
function fardStrip(d) {
  const k = dkey(d), log = peek(d), today = isToday(d);
  if (isExcused(d)) return `<div class="note">${icon('heart')}<div><b>${t('exc.title')}</b><p>${t('exc.text')}</p></div></div>`;
  const tasks = tasksFor(d), has = id => tasks.some(x => x.id === id);
  const fard = tasks.filter(x => x.kind === 'fard');
  const live = today && S.settings.lat != null;
  const now = new Date(), p = live ? prayerTimes(now) : null;
  const safar = isSafar(d);

  const chip = id => {
    if (!id || !has(id)) return '';
    const on = log[id] === true, title = t('task.' + id, { n: S.settings.zuhrAfter });
    return `<button class="rchip ${on ? 'on' : ''}" data-a="toggle" data-id="${id}" data-d="${k}" data-info="${id}" role="checkbox" aria-checked="${on}" aria-label="${esc(title)}" title="${esc(title)}">${on ? icon('check') : ''}<span>${ratibN(id)}</span></button>`;
  };
  const cols = live ? ['fajr', 'sunrise', 'zuhr', 'asr', 'maghrib', 'isha'] : FARD;
  const anyTop = FARD.some(id => RATIB_POS[id][0].some(has)), anyBot = FARD.some(id => RATIB_POS[id][1].some(has));

  // текущий и следующий намаз
  let cur = -1, next = null, frac = 0;
  if (live) {
    const times = { fajr: p.fajr, sunrise: p.sunrise, zuhr: p.dhuhr, asr: p.asr, maghrib: p.maghrib, isha: p.isha };
    cur = cols.length - 1;
    cols.forEach((id, i) => { if (now >= times[id]) cur = i; });
    const ni = cols.findIndex(id => times[id] > now);
    next = ni >= 0 ? [cols[ni], times[cols[ni]]] : ['fajr', prayerTimes(addDays(dateOnly(now), 1)).fajr];
    const start = now < p.fajr ? prayerTimes(addDays(dateOnly(now), -1)).isha : times[cols[cur]];
    frac = clamp((now - start) / (next[1] - start), 0, 1);
    cols.timeOf = id => times[id];
  }
  const name = id => id === 'sunrise' ? t('slot.sunrise') : t('task.' + id);

  const column = (id, i) => {
    const isNow = i === cur;
    const top = id === 'sunrise' ? '' : RATIB_POS[id][0].map(chip).join('');
    const bot = id === 'sunrise' ? '' : RATIB_POS[id][1].map(chip).join('');
    const tm = live ? `<span class="tm">${hm(cols.timeOf(id))}</span>` : '';
    let tile;
    if (id === 'sunrise') {
      tile = `<div class="slot sun ${isNow ? 'now' : ''}"><span class="n">${name(id)}</span>${tm}<span class="mk">${icon('sunrise')}</span>${isNow ? `<span class="el" style="width:${(frac * 100).toFixed(1)}%"></span>` : ''}</div>`;
    } else {
      const v = log[id], st = STATUS[v];
      const short = safar && ['zuhr', 'asr', 'isha'].includes(id) ? `, ${t('rak.short')}` : '';
      tile = `<button class="slot ${st ? 'done' : ''} ${isNow ? 'now' : ''}" style="--c:${st ? st.color : 'transparent'}" data-a="fard" data-id="${id}" data-d="${k}" data-info="${id}" aria-label="${name(id)}${live ? ' ' + hm(cols.timeOf(id)) : ''}${short}: ${st ? t('st.' + v) : t('st.none')}">
        <span class="n">${name(id)}</span>${tm}
        <span class="mk">${st ? icon(st.icon) : '<span class="ring"></span>'}</span>
        ${isNow ? `<span class="el" style="width:${(frac * 100).toFixed(1)}%"></span>` : ''}</button>`;
    }
    return `<div class="pcol">${anyTop ? `<div class="rrow">${top}</div>` : ''}${tile}${anyBot ? `<div class="rrow">${bot}</div>` : ''}</div>`;
  };

  // строка над плашкой и под ней
  let head = '', foot = '', period = 'plain';
  if (live) {
    period = skyPeriod(now, p);
    const dayFrac = x => ((x.getHours() * 60 + x.getMinutes()) / 1440 * 100).toFixed(2);
    const ticks = ['fajr', 'sunrise', 'zuhr', 'asr', 'maghrib', 'isha'].map(id => `<i class="tk ${id === 'sunrise' ? 'sun' : ''}" style="left:${dayFrac(cols.timeOf(id))}%"></i>`).join('');
    const isDayNow = now >= p.sunrise && now < p.maghrib;
    head = `<div class="sky-head">
        <span>${t('info.next', { name: name(next[0]), t: `<b>${dur(next[1] - now)}</b>` })}</span>
        <span class="sky-clock">${hm(now)}</span></div>
      <div class="tl" aria-hidden="true"><i class="tl-day" style="left:${dayFrac(p.sunrise)}%;right:${(100 - dayFrac(p.maghrib)).toFixed(2)}%"></i>${ticks}<i class="tl-now ${isDayNow ? 'sun' : 'moon'}" style="left:${dayFrac(now)}%"></i></div>`;
    const items = [];
    const f = forbiddenNow(now);
    if (f) items.push(`<span class="warn">${icon('alert')}${t('info.forbidden', { t: dur(f[1] - now) })}</span>`);
    if (now >= p.fajr && now < p.dhuhr) { const [a, b] = duhaWindow(p); items.push(`<span>${icon('sun')}${t('info.duha', { a: `<b>${hm(a)}</b>`, b: `<b>${hm(b)}</b>` })}</span>`); }
    if (now >= p.maghrib || now < p.fajr) {
      const w = nightWindow(now);
      items.push(`<span>${icon('moon')}${t('info.half', { t: `<b>${hm(halfNight(w[0], w[1]))}</b>` })}</span>`);
      items.push(`<span>${icon('star')}${t('info.third', { t: `<b>${hm(lastThird(w[0], w[1]))}</b>` })}</span>`);
    }
    if (items.length) foot = `<div class="sky-foot">${items.join('')}</div>`;
  }
  const ask = today && !live ? `<button class="ask-city" data-a="city">${icon('pin')}<span class="grow">${t('city.ask')}</span>${icon('chev', 'dir')}</button>` : '';
  return `<section class="sky ${period}" aria-label="${t('stats.prayers')}">${live ? SKYLINE : ''}${head}
    <div class="pgrid ${live ? 'six' : 'five'}">${cols.map(column).join('')}</div>${foot}</section>${ask}`;
}

function summary(d) {
  const tasks = tasksFor(d), log = peek(d), k = dkey(d);
  const done = tasks.filter(x => isDone(x, log)).length, p = tasks.length ? done / tasks.length : 0;
  const C = 2 * Math.PI * 21, today = isToday(d);
  const safar = isSafar(d), exc = isExcused(d);
  return `<section class="sum">
    <svg class="ring-p" viewBox="0 0 52 52" role="img" aria-label="${Math.round(p * 100)}%">
      <circle class="rt" cx="26" cy="26" r="21"/>
      <circle class="rv" cx="26" cy="26" r="21" stroke-dasharray="${C.toFixed(2)}" stroke-dashoffset="${(C * (1 - p)).toFixed(2)}" transform="rotate(-90 26 26)"/>
      <text x="26" y="30.5">${Math.round(p * 100)}%</text>
    </svg>
    <div class="grow">
      <div class="t">${t(today ? 'sum.today' : 'sum.day', { a: done, b: tasks.length })}</div>
      ${today ? `<div class="s">${icon('fire')}${t('sum.streak', { n: nDays(fardStreak()) })}</div>` : ''}
    </div>
    <div class="toggles">
      <button class="chip ${safar ? 'on' : ''}" data-a="safar" data-d="${k}" aria-pressed="${safar}">${icon('bag')}${t('chip.safar')}</button>
      ${S.settings.female ? `<button class="chip ${exc ? 'on' : ''}" data-a="excused" data-d="${k}" aria-pressed="${exc}">${icon('heart')}${t('chip.excused')}</button>` : ''}
    </div>
  </section>`;
}

/** С Магриба четверга — пятничные пункты (записываются в пятницу). */
function fridayNight(d) {
  if (!isToday(d) || d.getDay() !== 4 || !S.settings.fridayMode) return '';
  const p = prayerTimes(new Date());
  if (!p || new Date() < p.maghrib) return '';
  const fri = addDays(d, 1);
  const items = tasksFor(fri).filter(x => x.id === 'fr_kahf' || x.id === 'fr_salawat');
  if (!items.length) return '';
  return sectionHtml('frinight', t('sec.frinight'), items, peek(fri), dkey(fri), t('sec.frinightNote'), true);
}

const SECTIONS = [
  ['sunna', ['nafl']], ['read', ['read']], ['dhikr', ['azkar', 'friday', 'custom']],
  ['small', ['small']], ['sleep', ['sleep']], ['avoid', ['avoid']],
];
function sections(d) {
  const ts = tasksFor(d).filter(x => x.kind !== 'fard'), log = peek(d), k = dkey(d);
  return SECTIONS.map(([key, groups]) => {
    const items = ts.filter(x => groups.includes(x.group));
    return items.length ? sectionHtml(key, t('sec.' + key), items, log, k) : '';
  }).join('');
}
function sectionHtml(key, title, items, log, k, note = '', accent = false) {
  const done = items.filter(x => isDone(x, log)).length, open = !S.settings.folded[key];
  const checks = items.filter(x => x.kind !== 'counter'), counters = items.filter(x => x.kind === 'counter');
  return `<section class="sec ${open ? 'open' : ''} ${accent ? 'accent' : ''}">
    <button class="sec-h" data-a="foldSec" data-v="${key}" aria-expanded="${open}">
      <span class="title grow">${title}</span><span class="cnt">${t('n.of', { a: done, b: items.length })}</span>
      <span class="mini"><i style="width:${(done / items.length * 100).toFixed(0)}%"></i></span>${icon('chev', 'rot')}
    </button>
    ${open ? `<div class="sec-b">
      ${note ? `<p class="sec-note">${note}</p>` : ''}
      ${checks.length ? `<div class="pills">${checks.map((x, i) => pill(x, log, k, checks.length % 2 === 1 && i === checks.length - 1)).join('')}</div>` : ''}
      ${counters.map(x => counterRow(x, log, k)).join('')}
    </div>` : ''}
  </section>`;
}
function pill(x, log, k, wide) {
  const on = log[x.id] === true, avoid = x.kind === 'avoid';
  return `<button class="pill ${on ? 'on' : ''} ${avoid ? 'avoid' : ''} ${wide ? 'wide' : ''}" data-a="toggle" data-id="${x.id}" data-d="${k}" data-info="${x.id}" role="checkbox" aria-checked="${on}">
    <span class="pc">${icon('check')}</span><span>${esc(x.short || x.title)}</span></button>`;
}
function counterRow(x, log, k) {
  const n = iv(log[x.id]), done = n >= x.goal, b = bookFor(x.id);
  const parts = [t('ctr.line', { n, g: x.goal, u: esc(x.unit) })];
  if (b) parts.push(t('ctr.inBook', { a: b.currentPage, b: b.totalPages }));
  if (x.id === 'quran') {
    if (S.quran.page != null) parts.push(t('ctr.mark', { s: esc(suraName(S.quran.sura)), a: S.quran.ayah }));
    if (S.settings.khatmActive && isToday(parseKey(k))) parts.push(t('ctr.khatm', { a: S.settings.khatmPage }));
  }
  return `<div class="ctr ${done ? 'done' : ''}">
    <button class="body" data-a="countInput" data-id="${x.id}" data-d="${k}" data-info="${x.id}">
      <span class="t">${esc(x.title)}</span><span class="s">${parts.join(', ')}</span>
      <span class="meter"><i style="width:${Math.min(100, n / x.goal * 100).toFixed(0)}%"></i></span></button>
    <div class="stepper"><button data-a="count" data-v="-1" data-id="${x.id}" data-d="${k}" aria-label="−1">${icon('minus')}</button>
    <button data-a="count" data-v="1" data-id="${x.id}" data-d="${k}" aria-label="+1">${icon('plus')}</button></div>
  </div>`;
}

// =====================================================================
//  КАЛЕНДАРЬ

function viewCalendar() {
  const today = todayDate();
  if (!ui.cal) ui.cal = new Date(today.getFullYear(), today.getMonth(), 1);
  const m = ui.cal, days = new Date(m.getFullYear(), m.getMonth() + 1, 0).getDate(), lead = wdi(m);
  const canNext = m.getFullYear() < today.getFullYear() || (m.getFullYear() === today.getFullYear() && m.getMonth() < today.getMonth());
  const monday = new Date(2024, 0, 1);
  let cells = '';
  for (let i = 0; i < lead; i++) cells += '<span></span>';
  for (let n = 1; n <= days; n++) {
    const d = new Date(m.getFullYear(), m.getMonth(), n), future = d > today, p = future ? 0 : progress(d);
    const isT = dkey(d) === dkey(today);
    const bg = `color-mix(in srgb, var(--accent) ${Math.round(p * 100)}%, var(--surface-2))`;
    const fg = p > .55 ? 'var(--on-accent)' : 'var(--ink)';
    cells += future
      ? `<span class="cell future">${n}</span>`
      : `<button class="cell ${isT ? 'today' : ''}" style="background:${bg};color:${fg}" data-a="day" data-d="${dkey(d)}" aria-label="${human(d)}: ${Math.round(p * 100)}%">${n}${isExcused(d) ? '<i class="dot"></i>' : ''}</button>`;
  }
  return `<div class="cal-head"><button class="icon-btn" data-a="calMove" data-v="-1" aria-label="${t('a.prevMonth')}">${icon('back', 'dir')}</button>
      <h2>${monthYear(m)}</h2>
      <button class="icon-btn" data-a="calMove" data-v="1" ${canNext ? '' : 'disabled'} aria-label="${t('a.nextMonth')}">${icon('chev', 'dir')}</button></div>
    <div class="wd">${[...Array(7)].map((_, i) => `<span>${wdShort(addDays(monday, i))}</span>`).join('')}</div>
    <div class="grid">${cells}</div>
    <p class="prose">${t('cal.hint')}</p>`;
}

function viewLibrary() {
  const s = S.settings, td = todayDate(), q = S.quran;
  const markLine = `<button class="mark-line" data-a="quranMark">${icon('bookmark')}<span class="grow">${q.page == null ? t('lib.markNone')
    : t('lib.mark', { s: esc(suraName(q.sura)), a: q.ayah, p: q.page })}</span>${icon('edit')}</button>`;
  const khatm = s.khatmActive
    ? `<section class="card khatm">
        <div class="hd">${icon('book')}<h2 class="grow">${t('khatm.title')}</h2></div>
        <p class="khatm-big">${Math.round(s.khatmPage / 604 * 100)}<small>%</small></p>
        <div class="bar" style="margin:6px 0 10px"><i style="width:${(s.khatmPage / 604 * 100).toFixed(1)}%"></i></div>
        <div class="kv"><span class="muted">${t('khatm.read')}</span><b>${t('khatm.of604', { n: s.khatmPage })}</b></div>
        ${s.khatmPage >= 604 ? `<p>${t('khatm.done')}</p>` : `<div class="kv"><span class="muted">${t('khatm.today')}</span><b>${khatmTodayGoal()} ${t('u.p')}</b></div>
        <div class="kv"><span class="muted">${t('khatm.until')}</span><b>${human(parseKey(s.khatmEnd))}</b></div>`}
        <div class="btn-row" style="margin-bottom:0"><button class="btn ghost sm" data-a="open" data-v="khatm">${t('khatm.manage')}</button></div>
        ${markLine}
      </section>`
    : `<section class="card khatm">
        <div class="hd">${icon('book')}<h2 class="grow">${t('khatm.title')}</h2></div>
        <p class="muted khatm-pitch">${t('khatm.pitch')}</p>
        <button class="btn ghost sm" data-a="khatmStart">${t('khatm.plan')}</button>
        ${markLine}
      </section>`;

  const shelves = ['reading', 'want', 'done'];
  const list = S.books.filter(b => b.status === ui.shelf);
  const year = td.getFullYear();
  const doneYear = S.books.filter(b => b.status === 'done' && b.finishedAt && parseKey(b.finishedAt).getFullYear() === year).length;

  const readingRow = b => {
    const pct = b.currentPage / Math.max(1, b.totalPages) * 100, today = iv(peek(td)['book_' + b.id]), fc = bookForecast(b);
    return `<button class="book" data-a="open" data-v="book" data-id="${b.id}">${coverHtml(b, 'sm')}
      <span class="grow"><span class="t">${esc(b.title)}</span>${b.author ? `<span class="au">${esc(b.author)}</span>` : ''}
        <span class="meter" style="margin-top:9px"><i style="width:${pct.toFixed(0)}%"></i></span>
        <span class="s">${t('book.progressLine', { a: b.currentPage, b: b.totalPages, c: today, g: b.dailyGoal })}${fc ? `<br>${t(fc.byPace ? 'book.forecast' : 'book.forecastGoal', { d: human(fc.date) })}` : ''}</span></span></button>`;
  };
  const gridItem = b => `<button class="shelf-item" data-a="open" data-v="book" data-id="${b.id}">${coverHtml(b)}
      <span class="si-t">${esc(b.title)}</span>
      ${b.status === 'done'
        ? `<span class="si-s">${b.rating ? `<span class="stars ro">${[1, 2, 3, 4, 5].map(n => `<span class="${n <= b.rating ? 'on' : ''}">${icon('star')}</span>`).join('')}</span>` : (b.finishedAt ? human(parseKey(b.finishedAt)) : '')}</span>`
        : `<span class="si-s">${t('book.pages', { n: b.totalPages })}</span>`}</button>`;

  let body;
  if (!list.length) {
    body = `<div class="empty-art">${ART.books}<p>${t('shelf.empty.' + ui.shelf)}</p>
      ${ui.shelf !== 'done' ? `<button class="btn primary" data-a="addBook" data-v="${ui.shelf}">${icon('plus')}${t('book.add')}</button>` : ''}</div>`;
  } else if (ui.shelf === 'reading') {
    body = `<div class="list">${list.map(readingRow).join('')}</div>`;
  } else {
    body = `<div class="shelf">${list.map(gridItem).join('')}</div>`;
  }

  return `<header class="top"><h1 class="grow">${t('lib.title')}</h1>
      <button class="icon-btn" data-a="addBook" aria-label="${t('book.add')}">${icon('plus')}</button></header>
